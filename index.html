• ଖେଡ଼ା ସତ୍ୟାଗ୍ରହ (୧୯୧୮): ଇନ୍ଦୁଲାଲ୍ ଯାଜ୍ଞିକ ଓ ସର୍ଦ୍ଦାର ପଟେଲ୍ ଙ୍କ ସହଯୋଗ ।

    const db = {
      get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
      set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
      init: () => {
        if (!localStorage.getItem(DB_KEYS.CLASSES)) db.set(DB_KEYS.CLASSES, SEED_CLASSES);
        if (localStorage.getItem('sp_db_ver') !== DB_VERSION) {
          localStorage.setItem(DB_KEYS.SUBJECTS, JSON.stringify(SEED_DATA.subjects));
          localStorage.setItem(DB_KEYS.TOPICS, JSON.stringify(SEED_DATA.topics));
          localStorage.setItem(DB_KEYS.QUESTIONS, JSON.stringify(SEED_DATA.questions));
          localStorage.setItem(DB_KEYS.NOTES, JSON.stringify(SEED_DATA.notes));
          localStorage.setItem('sp_db_ver', DB_VERSION);
        }
      }
    };
    db.init();

    function toast(title, msg, type = 'info') {
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-indigo-600 text-white'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      const toastEl = document.createElement('div');
      toastEl.className = `${colors[type]} p-4 rounded-xl shadow-xl flex items-start gap-3 pointer-events-auto transition transform translate-x-0 max-w-sm`;
      toastEl.innerHTML = `
        <i class="fa-solid ${icons[type]} text-lg mt-0.5"></i>
        <div>
          <h4 class="font-bold text-sm leading-tight">${title}</h4>
          <p class="text-xs opacity-90 mt-0.5 leading-normal">${msg}</p>
        </div>
      `;
      document.getElementById('toastContainer').appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toastEl.remove(), 300);
      }, 4000);
    }

    function confirmDialog(title, msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMsg').innerText = msg;
      modal.classList.remove('hidden');

      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

      getAdmin: () => JSON.parse(sessionStorage.getItem(DB_KEYS.AUTH_ADMIN)),
      isGuest: () => sessionStorage.getItem('sp_guest_mode') === 'true',
      setStudent: (data) => {
        sessionStorage.removeItem('sp_guest_mode');
        sessionStorage.setItem(DB_KEYS.AUTH_STUDENT, JSON.stringify(data));
      },
      setAdmin: (data) => sessionStorage.setItem(DB_KEYS.AUTH_ADMIN, JSON.stringify(data)),
      logout: () => {
        sessionStorage.removeItem(DB_KEYS.AUTH_STUDENT);
        sessionStorage.removeItem(DB_KEYS.AUTH_ADMIN);

                      <td class="p-3"><code class="bg-amber-50 text-amber-800 px-2 py-0.5 rounded font-mono font-bold border border-amber-200">${s.password}</code></td>
                      <td class="p-3"><button onclick="deleteStudent('${s.studentId}')" class="text-rose-600 hover:underline text-[10px] font-bold">Remove</button></td>
                    </tr>
                  `).join('') : `<tr><td colspan="6" class="p-6 text-center text-slate-400">No active students yet.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `,

        questions: ({ questions }) => `
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4">
            <h3 class="text-lg font-black text-slate-900">Current Question Bank Repository (${questions.length})</h3>
            <div class="space-y-3">
              ${questions.map((q, idx) => `
                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs flex justify-between items-start gap-4">
                  <div>
                    <span class="bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded text-[10px]">Class ${q.class}</span>
                    <h4 class="font-bold text-slate-900 mt-1">${idx + 1}. ${q.question}</h4>
                    ${q.questionOdia ? `<p class="text-indigo-950 font-semibold mt-0.5">${q.questionOdia}</p>` : ''}
                    <p class="text-emerald-700 font-bold mt-1">Correct Key: Option ${q.correctAnswer} (${q.options[q.correctAnswer]})</p>
                  </div>
                  <button onclick="deleteQuestion('${q.id}')" class="text-rose-600 hover:underline font-bold text-[10px]">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `
      }
    };

    /**
     * DYNAMIC SMART HTML IMPORTER CONTROLLERS
     */
    function updateImporterSubjects() {
      const cls = document.getElementById('impClassSelect').value;
      const subSelect = document.getElementById('impSubjectSelect');
      const subjects = db.get(DB_KEYS.SUBJECTS).filter(s => s.class === cls);
      
      subSelect.innerHTML = subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      updateImporterTopics();
    }

    function updateImporterTopics() {
      const subId = document.getElementById('impSubjectSelect').value;
      const topSelect = document.getElementById('impTopicSelect');
      const topics = db.get(DB_KEYS.TOPICS).filter(t => t.subjectId === subId);
      
      topSelect.innerHTML = topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    }

    function addNewClass() {
      const newCls = document.getElementById('impNewClass').value.trim();
      if (!newCls) return alert("Enter class name or number!");
      const classes = db.get(DB_KEYS.CLASSES);
      if (!classes.includes(newCls)) {
        classes.push(newCls);
        db.set(DB_KEYS.CLASSES, classes);
        toast("Class Added", `Class ${newCls} created successfully.`, "success");
        router.navigate('admin-dashboard', { tab: 'html-upload' });
      }

    function addNewSubject() {
      const cls = document.getElementById('impClassSelect').value;
      const newSubName = document.getElementById('impNewSubject').value.trim();
      if (!newSubName) return alert("Enter subject name!");

      const subjects = db.get(DB_KEYS.SUBJECTS);
      const newSubId = "sub_" + cls + "_" + Date.now();
      subjects.push({ id: newSubId, class: cls, name: newSubName });
      db.set(DB_KEYS.SUBJECTS, subjects);

      toast("Subject Added", `${newSubName} created for Class ${cls}.`, "success");
      document.getElementById('impNewSubject').value = '';
      updateImporterSubjects();
      document.getElementById('impSubjectSelect').value = newSubId;
      updateImporterTopics();
    }

    function addNewTopic() {
      const cls = document.getElementById('impClassSelect').value;
      const subId = document.getElementById('impSubjectSelect').value;
      const newTopName = document.getElementById('impNewTopic').value.trim();
      if (!newTopName) return alert("Enter chapter/topic name!");

      const topics = db.get(DB_KEYS.TOPICS);
      const newTopId = "top_" + cls + "_" + Date.now();
      topics.push({ id: newTopId, class: cls, subjectId: subId, name: newTopName, isDemo: topics.filter(t => t.subjectId === subId).length === 0 });
      db.set(DB_KEYS.TOPICS, topics);

      toast("Topic Created", `${newTopName} created successfully.`, "success");
      document.getElementById('impNewTopic').value = '';
      updateImporterTopics();
      document.getElementById('impTopicSelect').value = newTopId;
    }

    function handleHtmlImport(e) {
      e.preventDefault();
      const cls = document.getElementById('impClassSelect').value;
      const subId = document.getElementById('impSubjectSelect').value;
      const topId = document.getElementById('impTopicSelect').value;
      const htmlCode = document.getElementById('impHtmlCode').value;

      if (!subId || !topId) {
        return alert("Please select or add a Subject and Chapter/Topic first!");
      }

      try {
        let extractedQuestions = [];

        // Match questionsData array from pasted HTML/JS
        const jsMatch = htmlCode.match(/questionsData\s*=\s*(\[[\s\S]*?\]);/);
        
        if (jsMatch && jsMatch[1]) {
          const rawParsed = Function('"use strict";return (' + jsMatch[1] + ')')();
          
          rawParsed.forEach(q => {
            extractedQuestions.push({
              id: "q_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
              class: cls,
              subjectId: subId,
              topicId: topId,
              question: q.qEn || q.question || "Question",
              questionOdia: q.qOr || q.questionOdia || "",
              options: q.options || { A: "", B: "", C: "", D: "" },
              correctAnswer: q.ans || q.correctAnswer || "A",
              explanation: (q.expOr || "") + "\n" + (q.expEn || q.explanation || "") + (q.analysis ? "\n" + q.analysis.join("\n") : ""),
              marks: 1
            });
          });
        } else {
          // Direct JSON Fallback
          const rawParsed = JSON.parse(htmlCode);
          if (Array.isArray(rawParsed)) {
            rawParsed.forEach(q => {
              extractedQuestions.push({
                id: "q_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
                class: cls,
                subjectId: subId,
                topicId: topId,
                question: q.question || q.qEn,
                questionOdia: q.questionOdia || q.qOr || "",
                options: q.options,
                correctAnswer: q.correctAnswer || q.ans,
                explanation: q.explanation || q.expOr || "",
                marks: 1
              });
            });
          }
        }

        if (extractedQuestions.length === 0) {
          throw new Error("No questionsData array found in the pasted HTML code.");
        }

        const allQuestions = db.get(DB_KEYS.QUESTIONS);
        extractedQuestions.forEach(q => allQuestions.push(q));
        db.set(DB_KEYS.QUESTIONS, allQuestions);

        toast("HTML Import Success! 🚀", `Successfully parsed and loaded ${extractedQuestions.length} questions into the Portal.`, "success");
        router.navigate('admin-dashboard', { tab: 'questions' });

      } catch (err) {
        toast("Parser Error", err.message, "error");
      }
    }

    function approveStudent(type, id) {
      let record, studentType;
      if (type === 'adm') {
        const admissions = db.get(DB_KEYS.ADMISSIONS);
        record = admissions.find(a => a.id === id);
        record.status = "Approved";
        db.set(DB_KEYS.ADMISSIONS, admissions);
        studentType = "Admission";
      } else {
        const registrations = db.get(DB_KEYS.REGISTRATIONS);
        record = registrations.find(r => r.id === id);
        record.status = "Approved";
        db.set(DB_KEYS.REGISTRATIONS, registrations);
        studentType = "Registration";
      }

      const studentId = "SP" + record.class + "-" + Math.floor(1000 + Math.random() * 9000);
      const password = "PASS" + Math.floor(1000 + Math.random() * 9000);
      record.assignedStudentId = studentId;

      const students = db.get(DB_KEYS.STUDENTS);
      students.push({
        studentId,
        name: record.name,
        class: record.class,
        phone: record.phone,
        email: record.email,
        password: password,
        type: studentType
      });

    function deleteStudent(studentId) {
      confirmDialog('Remove Student', 'Delete this student profile?', () => {
        let students = db.get(DB_KEYS.STUDENTS).filter(s => s.studentId !== studentId);
        db.set(DB_KEYS.STUDENTS, students);
        toast('Student Removed', 'Profile deleted.', 'info');
        router.navigate('admin-dashboard', { tab: 'students' });
      });
    }

    function deleteQuestion(qId) {
      confirmDialog('Delete Question', 'Permanently delete this question?', () => {
        let questions = db.get(DB_KEYS.QUESTIONS).filter(q => q.id !== qId);
        db.set(DB_KEYS.QUESTIONS, questions);
        toast('Deleted', 'Question removed.', 'info');
        router.navigate('admin-dashboard', { tab: 'questions' });
      });
    }

    function startTestEngine(subjectId, topicId, mode) {
      const subject = db.get(DB_KEYS.SUBJECTS).find(s => s.id === subjectId);
      const topic = db.get(DB_KEYS.TOPICS).find(t => t.id === topicId);
      let questions = db.get(DB_KEYS.QUESTIONS).filter(q => q.topicId === topicId);

      if (questions.length === 0) {
        questions = db.get(DB_KEYS.QUESTIONS);
      }

      activeExam = {
        mode,
        subject,
        topic,
        questions,
        currentIndex: 0,
        answers: {},
        practiceRevealed: {},
        timeLeft: 600,
        startTime: Date.now(),
        timerInterval: null
      };

      const navTimer = document.getElementById('navTimerBadge');
      if (mode === 'exam') {
        navTimer.classList.remove('hidden');
        startTimer();
      } else {
        navTimer.classList.add('hidden');
      }
      router.navigate('test-screen');
    }

    function startTimer() {
      clearInterval(activeExam.timerInterval);
      activeExam.timerInterval = setInterval(() => {
        activeExam.timeLeft--;
        const m = Math.floor(activeExam.timeLeft / 60);
        const s = activeExam.timeLeft % 60;
        const timeStr = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        const navTimerVal = document.getElementById('navTimerVal');
        if (navTimerVal) navTimerVal.innerText = timeStr;
        if (activeExam.timeLeft <= 0) {
          clearInterval(activeExam.timerInterval);
          finishTest(true);
        }
      }, 1000);
    }

    function renderQuestion() {
      const q = activeExam.questions[activeExam.currentIndex];
      const isLast = activeExam.currentIndex === activeExam.questions.length - 1;
      const isFirst = activeExam.currentIndex === 0;

      document.getElementById('testMetaMode').innerText = activeExam.mode === 'exam' ? 'Exam CBT' : 'Interactive Practice';
      document.getElementById('testMetaMode').className = `font-extrabold uppercase px-2 py-0.5 rounded text-[10px] ${activeExam.mode === 'exam' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}`;
      document.getElementById('testMetaTopic').innerText = activeExam.topic ? activeExam.topic.name : 'All Topics';
      document.getElementById('testMetaProgress').innerText = `${activeExam.currentIndex + 1} / ${activeExam.questions.length}`;
      document.getElementById('testQEn').innerText = `Q${activeExam.currentIndex + 1}. ${q.question}`;
      document.getElementById('testQOr').innerText = q.questionOdia || '';

      const container = document.getElementById('testOptionsBox');
      container.innerHTML = '';
      const userPick = activeExam.answers[q.id];

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        let btnClasses = "w-full p-4 rounded-2xl border text-left font-medium text-xs sm:text-sm flex items-center justify-between transition transform active:scale-[0.99] ";

        if (activeExam.mode === 'exam') {
          if (userPick === key) {
            btnClasses += "border-indigo-600 bg-indigo-600 text-white font-bold shadow-md";
          } else {
            btnClasses += "border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800";
          }
        } else {
          if (activeExam.practiceRevealed[q.id]) {
            if (key === q.correctAnswer) {
              btnClasses += "border-emerald-600 bg-emerald-50 text-emerald-900 font-bold";
            } else if (userPick === key) {
              btnClasses += "border-rose-600 bg-rose-50 text-rose-900 font-bold";
            } else {
              btnClasses += "border-slate-200 bg-slate-50 opacity-60 text-slate-600";
            }
          } else {
            btnClasses += "border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800";
          }
        }

        btn.className = btnClasses;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg bg-white/40 border border-slate-300/40 flex items-center justify-center font-bold text-xs">${key}</span>
            <span>${val}</span>
          </div>
          ${activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id] && key === q.correctAnswer ? '<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>' : ''}
        `;
        btn.onclick = () => selectOption(q.id, key);
        container.appendChild(btn);
      });

      const practiceBox = document.getElementById('testPracticeBox');
      if (activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id]) {
        practiceBox.classList.remove('hidden');
        practiceBox.className = userPick === q.correctAnswer ? 'p-4 rounded-2xl text-xs space-y-1.5 border border-emerald-200 bg-emerald-50' : 'p-4 rounded-2xl text-xs space-y-1.5 border border-rose-200 bg-rose-50';
        practiceBox.innerHTML = `
          <div class="flex items-center gap-1.5 font-bold ${userPick === q.correctAnswer ? 'text-emerald-800' : 'text-rose-800'}">
            <i class="fa-solid ${userPick === q.correctAnswer ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
            <span>${userPick === q.correctAnswer ? 'Correct Answer!' : 'Incorrect Answer'}</span>
          </div>
          <p class="text-slate-700 text-[11px] leading-relaxed whitespace-pre-line"><strong>Explanation:</strong> ${q.explanation || 'Direct factual answer.'}</p>
        `;
      } else {
        practiceBox.classList.add('hidden');
      }

      document.getElementById('testPrevBtn').disabled = isFirst;
      if (isLast) {
        document.getElementById('testNextBtn').classList.add('hidden');
        document.getElementById('testSubmitBtn').classList.remove('hidden');
      } else {
        document.getElementById('testNextBtn').classList.remove('hidden');
        document.getElementById('testSubmitBtn').classList.add('hidden');
      }
    }

    function selectOption(qId, key) {
      activeExam.answers[qId] = key;
      if (activeExam.mode === 'practice') activeExam.practiceRevealed[qId] = true;
      renderQuestion();
    }

    function navigateQuestion(offset) {
      activeExam.currentIndex += offset;
      renderQuestion();
    }

    function confirmSubmitTest() {
      confirmDialog('Submit Assessment', 'Finish and submit your mock test?', () => {
        finishTest(false);
      });
    }

    function finishTest(isAutoTimeout = false) {
      clearInterval(activeExam.timerInterval);
      document.getElementById('navTimerBadge').classList.add('hidden');

      let correctCount = 0;
      let wrongCount = 0;
      let obtainedMarks = 0;
      let totalMarks = activeExam.questions.length;

      const breakdown = activeExam.questions.map(q => {
        const userAns = activeExam.answers[q.id];
        const isCorrect = userAns === q.correctAnswer;
        if (isCorrect) {
          correctCount++;
          obtainedMarks += (q.marks || 1);
        } else if (userAns) {
          wrongCount++;
        }
        return {
          question: q.question,
          questionOdia: q.questionOdia,
          userAnswer: userAns,
          correctAnswer: q.correctAnswer,
          correctOptionText: q.options[q.correctAnswer],
          isCorrect,
          explanation: q.explanation
        };
      });

      const percentage = Math.round((obtainedMarks / totalMarks) * 100) || 0;
      const student = auth.getStudent() || { name: "Guest", class: "10", studentId: "GST-DEMO" };

      const resultPayload = {
        id: "res_" + Date.now(),
        studentId: student.studentId,
        studentName: student.name,
        class: student.class,
        subjectName: activeExam.subject ? activeExam.subject.name : 'Social Science',
        topicName: activeExam.topic ? activeExam.topic.name : 'Chapter Unit',
        mode: activeExam.mode,
        totalMarks,
        obtainedMarks,
        correctCount,
        wrongCount,
        percentage,
        date: new Date().toLocaleString(),
        breakdown
      };

      const results = db.get(DB_KEYS.RESULTS);
      results.unshift(resultPayload);
      db.set(DB_KEYS.RESULTS, results);

      if (isAutoTimeout) toast('Time Out', 'Exam submitted automatically.', 'warning');
      router.navigate('result-screen', { resultData: resultPayload });
    }

    window.addEventListener('DOMContentLoaded', () => {
      router.navigate('home');
    });
  </script>
