<!DOCTYPE html>
<html lang="or" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SATYAPEETH — Odisha Board Online CBT & Learning Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Oriya:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans Oriya', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased custom-scrollbar selection:bg-amber-200">

  <!-- Toast Notification System -->
  <div id="toastContainer" class="fixed top-3 right-3 left-3 sm:left-auto z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Global Header -->
  <header class="bg-indigo-950 text-white sticky top-0 z-40 border-b border-indigo-900 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <!-- Brand Logo -->
      <div class="flex items-center gap-2 sm:gap-3 cursor-pointer select-none" onclick="router.navigate('home')">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-indigo-950 font-black text-sm sm:text-xl shadow-inner">
          SP
        </div>
        <div>
          <span class="text-base sm:text-xl font-black tracking-wider text-amber-400">SATYAPEETH</span>
          <span class="hidden md:inline-block text-[10px] text-indigo-200 uppercase tracking-widest font-semibold ml-2 border-l border-indigo-700 pl-2">Odisha Board Prep</span>
        </div>
      </div>

      <!-- Navigation Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Live Exam Timer Badge -->
        <div id="navTimerBadge" class="hidden flex items-center gap-1.5 bg-rose-950/90 border border-rose-500 text-rose-300 px-2.5 py-1 rounded-lg text-[11px] font-mono font-bold animate-pulse">
          <i class="fa-solid fa-stopwatch"></i>
          <span id="navTimerVal">00:00</span>
        </div>

        <!-- User Badge -->
        <div id="navUserBadge" class="hidden flex items-center gap-1.5 bg-indigo-900 border border-indigo-700 px-2.5 py-1 rounded-lg text-xs">
          <i class="fa-solid fa-user-graduate text-amber-400 text-xs"></i>
          <span id="navUserName" class="font-bold text-white text-xs truncate max-w-[100px] sm:max-w-[150px]"></span>
          <span id="navUserType" class="px-1.5 py-0.5 rounded text-[9px] font-extrabold hidden sm:inline-block"></span>
        </div>

        <!-- Auth Action Buttons -->
        <button id="navLoginBtn" onclick="router.navigate('login')" class="text-xs bg-indigo-800 hover:bg-indigo-700 border border-indigo-600 px-2.5 sm:px-3.5 py-1.5 rounded-lg font-bold text-white transition">
          Login
        </button>
        <button id="navRegBtn" onclick="router.navigate('register-free')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-1.5 rounded-lg font-bold transition">
          Register
        </button>
        <button id="navAdmBtn" onclick="router.navigate('admission')" class="text-xs bg-amber-500 hover:bg-amber-400 text-indigo-950 px-2.5 sm:px-3 py-1.5 rounded-lg font-extrabold transition">
          Admission
        </button>
        <button id="navLogoutBtn" onclick="auth.logout()" class="hidden text-xs bg-slate-800 hover:bg-rose-900 border border-slate-700 text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg font-bold transition">
          <i class="fa-solid fa-power-off"></i>
        </button>
        <button id="navAdminBtn" onclick="router.navigate('admin-auth')" class="text-xs bg-indigo-900/60 hover:bg-indigo-900 border border-indigo-800 text-indigo-300 hover:text-white px-2 py-1.5 rounded-lg transition" title="Admin Portal">
          <i class="fa-solid fa-shield-halved"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6"></main>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-sm w-full rounded-2xl shadow-2xl border border-slate-100 p-5 text-center">
      <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-3 text-lg">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 id="confirmTitle" class="text-base font-bold text-slate-900 mb-1">Confirm Action</h3>
      <p id="confirmMsg" class="text-xs text-slate-600 mb-5 leading-relaxed"></p>
      <div class="flex gap-2">
        <button id="confirmCancelBtn" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">Cancel</button>
        <button id="confirmOkBtn" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition">Confirm</button>
      </div>
    </div>
  </div>

  <footer class="bg-slate-900 text-slate-400 py-4 border-t border-slate-800 text-[11px] text-center">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <p>&copy; 2026 <strong>SATYAPEETH</strong> — BSE Odisha Examination Portal</p>
      <span>Classes 6 to 10 Special Curriculum</span>
    </div>
  </footer>

  <script>
    /**
     * DATABASE & PERSISTENT SESSION ENGINE
     */
    const DB_KEYS = {
      STUDENTS: 'sp_students_db',
      ADMISSIONS: 'sp_admissions_db',
      REGISTRATIONS: 'sp_registrations_db',
      CLASSES: 'sp_classes_db',
      SUBJECTS: 'sp_subjects_db',
      TOPICS: 'sp_topics_db',
      NOTES: 'sp_notes_db',
      QUESTIONS: 'sp_questions_db',
      RESULTS: 'sp_results_db',
      AUTH_STUDENT: 'sp_perm_student',
      AUTH_ADMIN: 'sp_perm_admin'
    };

    const SEED_CLASSES = ["10", "9", "8", "7", "6"];

    const SEED_SUBJECTS = [
      { id: "sub_10_soc", class: "10", name: "Social Science (ଇତିହାସ ଓ ଭୂଗୋଳ)" },
      { id: "sub_10_fl_odia", class: "10", name: "First Language Odia (ସାହିତ୍ୟ ସିନ୍ଧୁ)" },
      { id: "sub_10_ps", class: "10", name: "Physical Science (ଭୌତିକ ବିଜ୍ଞାନ)" },
      { id: "sub_10_ls", class: "10", name: "Life Science (ଜୀବ ବିଜ୍ଞାନ)" },
      { id: "sub_10_mth", class: "10", name: "Mathematics (ଜ୍ୟାମିତି ଓ ବୀଜଗଣିତ)" },
      { id: "sub_10_eng", class: "10", name: "English" },
      { id: "sub_9_sci", class: "9", name: "Science (ବିଜ୍ଞାନ)" },
      { id: "sub_9_mth", class: "9", name: "Mathematics (ଗଣିତ)" },
      { id: "sub_9_odia", class: "9", name: "Odia (ସାହିତ୍ୟ ଧାରା)" }
    ];

    const SEED_TOPICS = [
      { id: "top_10_soc_1", class: "10", subjectId: "sub_10_soc", name: "ଭାରତୀୟ ଜାତୀୟ ଆନ୍ଦୋଳନରେ ଗାନ୍ଧିଜୀଙ୍କ ଆବିର୍ଭାବ", isDemo: true },
      { id: "top_10_soc_2", class: "10", subjectId: "sub_10_soc", name: "ଅସହଯୋଗ ଆନ୍ଦୋଳନ ଓ ଓଡ଼ିଶାର ଭୂମିକା", isDemo: false },
      { id: "top_10_ps_1", class: "10", subjectId: "sub_10_ps", name: "ରାସାୟନିକ ପ୍ରତିକ୍ରିୟା ଓ ସମୀକରଣ", isDemo: true },
      { id: "top_10_ls_1", class: "10", subjectId: "sub_10_ls", name: "ପୋଷଣ (Nutrition)", isDemo: true },
      { id: "top_10_odia_1", class: "10", subjectId: "sub_10_fl_odia", name: "ବନ୍ଦେ ଉତ୍କଳ ଜନନୀ", isDemo: true },
      { id: "top_10_mth_1", class: "10", subjectId: "sub_10_mth", name: "ସରଳ ସହସମୀକରଣ", isDemo: true }
    ];

    const db = {
      get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
      set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
      init: () => {
        if (!localStorage.getItem(DB_KEYS.CLASSES)) db.set(DB_KEYS.CLASSES, SEED_CLASSES);
        if (!localStorage.getItem(DB_KEYS.SUBJECTS)) db.set(DB_KEYS.SUBJECTS, SEED_SUBJECTS);
        if (!localStorage.getItem(DB_KEYS.TOPICS)) db.set(DB_KEYS.TOPICS, SEED_TOPICS);
        if (!localStorage.getItem(DB_KEYS.QUESTIONS)) db.set(DB_KEYS.QUESTIONS, []);
        if (!localStorage.getItem(DB_KEYS.STUDENTS)) db.set(DB_KEYS.STUDENTS, []);
        if (!localStorage.getItem(DB_KEYS.ADMISSIONS)) db.set(DB_KEYS.ADMISSIONS, []);
        if (!localStorage.getItem(DB_KEYS.REGISTRATIONS)) db.set(DB_KEYS.REGISTRATIONS, []);
      }
    };
    db.init();

    function toast(title, msg, type = 'info') {
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-indigo-600 text-white'
      };
      const toastEl = document.createElement('div');
      toastEl.className = `${colors[type]} p-3 rounded-xl shadow-xl flex items-start gap-2.5 pointer-events-auto transition transform max-w-sm border border-white/20 text-xs`;
      toastEl.innerHTML = `<div><h4 class="font-bold">${title}</h4><p class="opacity-90 mt-0.5">${msg}</p></div>`;
      document.getElementById('toastContainer').appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toastEl.remove(), 250);
      }, 3500);
    }

    function confirmDialog(title, msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMsg').innerText = msg;
      modal.classList.remove('hidden');

      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

    // PERSISTENT AUTHENTICATION (Survives Refresh)
    const auth = {
      getStudent: () => JSON.parse(localStorage.getItem(DB_KEYS.AUTH_STUDENT)),
      getAdmin: () => JSON.parse(localStorage.getItem(DB_KEYS.AUTH_ADMIN)),
      isGuest: () => localStorage.getItem('sp_guest_flag') === 'true',
      setStudent: (data) => {
        localStorage.removeItem('sp_guest_flag');
        localStorage.setItem(DB_KEYS.AUTH_STUDENT, JSON.stringify(data));
      },
      setAdmin: (data) => localStorage.setItem(DB_KEYS.AUTH_ADMIN, JSON.stringify(data)),
      logout: () => {
        localStorage.removeItem(DB_KEYS.AUTH_STUDENT);
        localStorage.removeItem(DB_KEYS.AUTH_ADMIN);
        localStorage.removeItem('sp_guest_flag');
        router.updateHeader();
        toast('Logged Out', 'Session ended successfully.', 'info');
        router.navigate('home');
      }
    };

    let activeExam = {
      mode: 'exam',
      subject: null,
      topic: null,
      questions: [],
      currentIndex: 0,
      answers: {},
      practiceRevealed: {},
      timerInterval: null,
      timeLeft: 600
    };

    const router = {
      currentRoute: 'home',
      updateHeader: () => {
        const student = auth.getStudent();
        const admin = auth.getAdmin();
        const isGuest = auth.isGuest();
        const navUser = document.getElementById('navUserBadge');
        const loginBtn = document.getElementById('navLoginBtn');
        const regBtn = document.getElementById('navRegBtn');
        const admBtn = document.getElementById('navAdmBtn');
        const logoutBtn = document.getElementById('navLogoutBtn');

        if (student) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = student.name;
          const badge = document.getElementById('navUserType');
          if (isGuest) {
            badge.className = "bg-amber-400 text-indigo-950 px-1.5 py-0.5 rounded text-[9px] font-extrabold";
            badge.innerText = "Guest Demo";
          } else if (student.type === 'Admission') {
            badge.className = "bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[9px] font-black";
            badge.innerText = "All Access";
          } else {
            badge.className = "bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold";
            badge.innerText = "Mock Pass";
          }
          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else if (admin) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = "Satyajeet Sahu";
          const badge = document.getElementById('navUserType');
          badge.className = "bg-rose-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold";
          badge.innerText = "Admin";
          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else {
          navUser.classList.add('hidden');
          loginBtn.classList.remove('hidden');
          regBtn.classList.remove('hidden');
          admBtn.classList.remove('hidden');
          logoutBtn.classList.add('hidden');
        }
      },

      navigate: (viewName, params = {}) => {
        router.currentRoute = viewName;
        router.updateHeader();
        const app = document.getElementById('app');

        if (viewName.startsWith('admin-dashboard') && !auth.getAdmin()) {
          toast('Admin Only', 'Please login with admin master credentials.', 'error');
          return router.navigate('admin-auth');
        }
        if (['student-dashboard', 'subject-select', 'topic-select', 'mode-select', 'test-screen', 'result-screen', 'notes-view'].includes(viewName) && !auth.getStudent()) {
          toast('Login Required', 'Please login to access this portal.', 'warning');
          return router.navigate('login');
        }

        switch (viewName) {
          case 'home': app.innerHTML = views.home(); break;
          case 'register-free': app.innerHTML = views.registerFree(); break;
          case 'admission': app.innerHTML = views.admission(); break;
          case 'login': app.innerHTML = views.login(); break;
          case 'student-dashboard': app.innerHTML = views.studentDashboard(); break;
          case 'subject-select': app.innerHTML = views.subjectSelect(); break;
          case 'topic-select': app.innerHTML = views.topicSelect(params.subjectId); break;
          case 'mode-select': app.innerHTML = views.modeSelect(params.subjectId, params.topicId); break;
          case 'test-screen': app.innerHTML = views.testScreen(); renderQuestion(); break;
          case 'result-screen': app.innerHTML = views.resultScreen(params.resultData); break;
          case 'notes-view': app.innerHTML = views.notesView(params.topicId); break;
          case 'admin-auth': app.innerHTML = views.adminAuth(); break;
          case 'admin-dashboard':
            app.innerHTML = views.adminDashboard(params.tab || 'html-upload');
            if ((params.tab || 'html-upload') === 'html-upload') {
              setTimeout(updateImporterSubjects, 50);
            }
            break;
          default: app.innerHTML = views.home();
        }
        window.scrollTo(0, 0);
      }
    };

    const views = {
      home: () => `
        <div class="space-y-6 sm:space-y-10">
          <div class="bg-gradient-to-br from-indigo-950 via-indigo-900 to-slate-900 text-white rounded-3xl p-6 sm:p-10 shadow-xl border border-indigo-800 text-center sm:text-left">
            <span class="inline-block bg-amber-400/20 text-amber-300 border border-amber-400/30 text-[11px] font-bold px-3 py-0.5 rounded-full uppercase">
              BSE Odisha Board Curriculum (6-10)
            </span>
            <h1 class="text-2xl sm:text-4xl font-black mt-3 leading-tight">
              Satyapeeth Online CBT & Smart Mock Portal
            </h1>
            <p class="text-indigo-200 text-xs sm:text-sm mt-2 max-w-xl leading-relaxed">
              Official chapter-wise practice tests with instant Odia & English explanations. Register for free mock access or apply for full admission.
            </p>
            <div class="mt-5 flex flex-wrap gap-2.5 justify-center sm:justify-start">
              <button onclick="router.navigate('admission')" class="bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black px-4 py-2.5 rounded-xl shadow text-xs">
                Full Admission (Notes + Mocks)
              </button>
              <button onclick="router.navigate('register-free')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl shadow text-xs">
                Free Mock Register
              </button>
              <button onclick="guestLogin()" class="bg-indigo-900 border border-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs">
                Guest Demo
              </button>
            </div>
          </div>
        </div>
      `,

      registerFree: () => `
        <div class="max-w-md mx-auto bg-white rounded-3xl p-5 sm:p-7 border border-slate-200 shadow-xl space-y-5">
          <div class="text-center">
            <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full uppercase">Free Registration</span>
            <h2 class="text-xl font-black text-slate-900 mt-1">Student Mock Registration</h2>
            <p class="text-[11px] text-slate-500">Apply for your verified mock test credentials.</p>
          </div>
          <form onsubmit="handleRegistrationSubmit(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Student Full Name *</label>
              <input type="text" id="regName" required placeholder="e.g. Subham Dash" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:border-emerald-600">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Class *</label>
                <select id="regClass" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold outline-none">
                  <option value="10">Class 10</option>
                  <option value="9">Class 9</option>
                  <option value="8">Class 8</option>
                  <option value="7">Class 7</option>
                  <option value="6">Class 6</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Mobile / WhatsApp *</label>
                <input type="tel" id="regPhone" required placeholder="10-digit number" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none">
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Email Address *</label>
              <input type="email" id="regEmail" required placeholder="student@gmail.com" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow">
              Submit Registration
            </button>
          </form>
        </div>
      `,

      admission: () => `
        <div class="max-w-md mx-auto bg-white rounded-3xl p-5 sm:p-7 border border-slate-200 shadow-xl space-y-5">
          <div class="text-center">
            <span class="text-[10px] font-bold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full uppercase">Full Access</span>
            <h2 class="text-xl font-black text-slate-900 mt-1">Student Admission Form</h2>
            <p class="text-[11px] text-slate-500">Access full chapter notes, e-books and mock tests.</p>
          </div>
          <form onsubmit="handleAdmissionSubmit(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Student Full Name *</label>
              <input type="text" id="admName" required placeholder="e.g. Priyaranjan Mohapatra" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:border-amber-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Guardian Name *</label>
                <input type="text" id="admGuardian" required placeholder="Father/Mother" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none">
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Class *</label>
                <select id="admClass" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold outline-none">
                  <option value="10">Class 10</option>
                  <option value="9">Class 9</option>
                  <option value="8">Class 8</option>
                  <option value="7">Class 7</option>
                  <option value="6">Class 6</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Mobile / WhatsApp *</label>
                <input type="tel" id="admPhone" required placeholder="10-digit number" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none">
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Email *</label>
                <input type="email" id="admEmail" required placeholder="email@gmail.com" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none">
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">School Name *</label>
              <input type="text" id="admSchool" required placeholder="School Name" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black rounded-xl text-xs transition shadow">
              Submit Admission Application
            </button>
          </form>
        </div>
      `,

              `).join('') : '<p class="text-xs text-slate-400 text-center py-4">No students enrolled yet.</p>'}
            </div>
          </div>
        `,

        questions: ({ questions }) => `
          <div class="bg-white rounded-2xl border p-4 space-y-3">
            <h3 class="text-sm font-black text-slate-900">Total Questions (${questions.length})</h3>
            <div class="space-y-2">
              ${questions.map((q, idx) => `
                <div class="p-3 bg-slate-50 rounded-xl border text-xs flex justify-between items-start gap-2">
                  <div>
                    <span class="bg-indigo-100 text-indigo-800 font-bold px-1.5 py-0.2 rounded text-[9px]">Class ${q.class}</span>
                    <h4 class="font-bold text-slate-900 mt-1">${idx + 1}. ${q.question}</h4>
                    <p class="text-emerald-700 font-bold mt-0.5">Key: Option ${q.correctAnswer}</p>
                  </div>
                  <button onclick="deleteQuestion('${q.id}')" class="text-rose-600 font-bold text-[10px]">Delete</button>
                </div>
              `).join('')}
            </div>
          </div>
        `
      }
    };

    /**
     * DYNAMIC SMART DROPDOWN LOADERS
     */
    function updateImporterSubjects() {
      const clsSelect = document.getElementById('impClassSelect');
      if (!clsSelect) return;
      const cls = clsSelect.value;
      const subSelect = document.getElementById('impSubjectSelect');
      const subjects = db.get(DB_KEYS.SUBJECTS).filter(s => s.class === String(cls));

      subSelect.innerHTML = subjects.length > 0 
        ? subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('') 
        : '<option value="">-- No Subject Found (Add New Below) --</option>';

      updateImporterTopics();
    }

    function updateImporterTopics() {
      const subSelect = document.getElementById('impSubjectSelect');
      const topSelect = document.getElementById('impTopicSelect');
      if (!subSelect || !topSelect) return;
      const subId = subSelect.value;
      const topics = db.get(DB_KEYS.TOPICS).filter(t => t.subjectId === subId);

      topSelect.innerHTML = topics.length > 0 
        ? topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('') 
        : '<option value="">-- No Topic Found (Add New Below) --</option>';
    }

    function addNewClass() {
      const newCls = document.getElementById('impNewClass').value.trim();
      if (!newCls) return alert("Enter class number!");
      const classes = db.get(DB_KEYS.CLASSES);
      if (!classes.includes(newCls)) {
        classes.push(newCls);
        db.set(DB_KEYS.CLASSES, classes);
        toast("Class Added", `Class ${newCls} created.`, "success");
        router.navigate('admin-dashboard', { tab: 'html-upload' });

    function addNewSubject() {
      const cls = document.getElementById('impClassSelect').value;
      const newSubName = document.getElementById('impNewSubject').value.trim();
      if (!newSubName) return alert("Enter subject name!");

      const subjects = db.get(DB_KEYS.SUBJECTS);
      const newSubId = "sub_" + cls + "_" + Date.now();
      subjects.push({ id: newSubId, class: cls, name: newSubName });
      db.set(DB_KEYS.SUBJECTS, subjects);

      toast("Subject Added", `${newSubName} created.`, "success");
      document.getElementById('impNewSubject').value = '';
      updateImporterSubjects();
      document.getElementById('impSubjectSelect').value = newSubId;
      updateImporterTopics();
    }

    function addNewTopic() {
      const cls = document.getElementById('impClassSelect').value;
      const subId = document.getElementById('impSubjectSelect').value;
      const newTopName = document.getElementById('impNewTopic').value.trim();
      if (!newTopName) return alert("Enter chapter name!");

      const topics = db.get(DB_KEYS.TOPICS);
      const newTopId = "top_" + cls + "_" + Date.now();
      topics.push({ id: newTopId, class: cls, subjectId: subId, name: newTopName, isDemo: false });
      db.set(DB_KEYS.TOPICS, topics);

      toast("Topic Created", `${newTopName} created.`, "success");
      document.getElementById('impNewTopic').value = '';
      updateImporterTopics();
      document.getElementById('impTopicSelect').value = newTopId;
    }

    function handleHtmlImport(e) {
      e.preventDefault();
      const cls = document.getElementById('impClassSelect').value;
      const subId = document.getElementById('impSubjectSelect').value;
      const topId = document.getElementById('impTopicSelect').value;
      const htmlCode = document.getElementById('impHtmlCode').value;

      if (!subId || !topId) {
        return alert("Please select or add a Subject and Chapter/Topic first!");
      }

      try {
        let extractedQuestions = [];
        const jsMatch = htmlCode.match(/questionsData\s*=\s*(\[[\s\S]*?\]);/);
        
        if (jsMatch && jsMatch[1]) {
          const rawParsed = Function('"use strict";return (' + jsMatch[1] + ')')();
          rawParsed.forEach(q => {
            extractedQuestions.push({
              id: "q_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
              class: cls,
              subjectId: subId,
              topicId: topId,
              question: q.qEn || q.question || "Question",
              questionOdia: q.qOr || q.questionOdia || "",
              options: q.options || { A: "", B: "", C: "", D: "" },
              correctAnswer: q.ans || q.correctAnswer || "A",
              explanation: (q.expOr || "") + "\n" + (q.expEn || q.explanation || "") + (q.analysis ? "\n" + q.analysis.join("\n") : ""),
              marks: 1
            });
          });
        } else {
          const rawParsed = JSON.parse(htmlCode);
          if (Array.isArray(rawParsed)) {
            rawParsed.forEach(q => {
              extractedQuestions.push({
                id: "q_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
                class: cls,
                subjectId: subId,
                topicId: topId,
                question: q.question || q.qEn,
                questionOdia: q.questionOdia || q.qOr || "",
                options: q.options,
                correctAnswer: q.correctAnswer || q.ans,
                explanation: q.explanation || q.expOr || "",
                marks: 1
              });
            });
          }
        }

        if (extractedQuestions.length === 0) throw new Error("No questionsData found in code.");

        const allQuestions = db.get(DB_KEYS.QUESTIONS);
        extractedQuestions.forEach(q => allQuestions.push(q));
        db.set(DB_KEYS.QUESTIONS, allQuestions);

        toast("Success!", `Loaded ${extractedQuestions.length} questions into Portal.`, "success");
        router.navigate('admin-dashboard', { tab: 'questions' });

      } catch (err) {
        toast("Parse Error", err.message, "error");
      }
    }

    function approveStudent(type, id) {
      let record, studentType;
      if (type === 'adm') {
        const admissions = db.get(DB_KEYS.ADMISSIONS);
        record = admissions.find(a => a.id === id);
        record.status = "Approved";
        db.set(DB_KEYS.ADMISSIONS, admissions);
        studentType = "Admission";
      } else {
        const registrations = db.get(DB_KEYS.REGISTRATIONS);
        record = registrations.find(r => r.id === id);
        record.status = "Approved";
        db.set(DB_KEYS.REGISTRATIONS, registrations);
        studentType = "Registration";
      }

      const studentId = "SP" + record.class + "-" + Math.floor(1000 + Math.random() * 9000);
      const password = "PASS" + Math.floor(1000 + Math.random() * 9000);
      record.assignedStudentId = studentId;

      const students = db.get(DB_KEYS.STUDENTS);
      students.push({
        studentId,
        name: record.name,
        class: record.class,
        phone: record.phone,
        email: record.email,
        password: password,
        type: studentType
      });
      db.set(DB_KEYS.STUDENTS, students);

      toast('Approved', `ID: ${studentId} & Password: ${password}`, 'success');
      router.navigate('admin-dashboard', { tab: type === 'adm' ? 'admissions' : 'registrations' });
    }

    function deleteStudent(studentId) {
      confirmDialog('Delete Student', 'Remove this profile?', () => {
        let students = db.get(DB_KEYS.STUDENTS).filter(s => s.studentId !== studentId);
        db.set(DB_KEYS.STUDENTS, students);
        toast('Deleted', 'Student removed.', 'info');
        router.navigate('admin-dashboard', { tab: 'students' });
      });
    }

    function deleteQuestion(qId) {
      confirmDialog('Delete Question', 'Remove this question?', () => {
        let questions = db.get(DB_KEYS.QUESTIONS).filter(q => q.id !== qId);
        db.set(DB_KEYS.QUESTIONS, questions);
        toast('Deleted', 'Question removed.', 'info');
        router.navigate('admin-dashboard', { tab: 'questions' });
      });
    }

    function startTestEngine(subjectId, topicId, mode) {
      const subject = db.get(DB_KEYS.SUBJECTS).find(s => s.id === subjectId);
      const topic = db.get(DB_KEYS.TOPICS).find(t => t.id === topicId);
      let questions = db.get(DB_KEYS.QUESTIONS).filter(q => q.topicId === topicId);

      if (questions.length === 0) {
        questions = [
          {
            id: "q_demo_1",
            question: "Sample Question",
            questionOdia: "ପ୍ରଶ୍ନ ଉପଲବ୍ଧ ନାହିଁ । (No questions in this topic)",
            options: { A: "A", B: "B", C: "C", D: "D" },
            correctAnswer: "A",
            explanation: "Upload questions from Admin Smart HTML Parser."
          }
        ];
      }

      activeExam = {
        mode,
        subject,
        topic,
        questions,
        currentIndex: 0,
        answers: {},
        practiceRevealed: {},
        timeLeft: 600
      };

      const navTimer = document.getElementById('navTimerBadge');
      if (mode === 'exam') {
        navTimer.classList.remove('hidden');
        startTimer();
      } else {
        navTimer.classList.add('hidden');
      }
      router.navigate('test-screen');
    }

    function startTimer() {
      clearInterval(activeExam.timerInterval);
      activeExam.timerInterval = setInterval(() => {
        activeExam.timeLeft--;
        const m = Math.floor(activeExam.timeLeft / 60);
        const s = activeExam.timeLeft % 60;
        const navTimerVal = document.getElementById('navTimerVal');
        if (navTimerVal) navTimerVal.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        if (activeExam.timeLeft <= 0) {
          clearInterval(activeExam.timerInterval);
          finishTest();
        }
      }, 1000);
    }

    function renderQuestion() {
      const q = activeExam.questions[activeExam.currentIndex];
      const isLast = activeExam.currentIndex === activeExam.questions.length - 1;
      const isFirst = activeExam.currentIndex === 0;

      document.getElementById('testMetaMode').innerText = activeExam.mode === 'exam' ? 'CBT Exam' : 'Practice';
      document.getElementById('testMetaMode').className = `font-bold uppercase px-2 py-0.5 rounded text-[10px] ${activeExam.mode === 'exam' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}`;
      document.getElementById('testMetaProgress').innerText = `${activeExam.currentIndex + 1} / ${activeExam.questions.length}`;
      document.getElementById('testQEn').innerText = `Q${activeExam.currentIndex + 1}. ${q.question}`;
      document.getElementById('testQOr').innerText = q.questionOdia || '';

      const container = document.getElementById('testOptionsBox');
      container.innerHTML = '';
      const userPick = activeExam.answers[q.id];

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        let btnClasses = "w-full p-3 rounded-xl border text-left font-medium text-xs flex items-center justify-between transition ";

        if (activeExam.mode === 'exam') {
          btnClasses += userPick === key ? "border-indigo-600 bg-indigo-600 text-white font-bold" : "border-slate-200 bg-slate-50";
        } else {
          if (activeExam.practiceRevealed[q.id]) {
            if (key === q.correctAnswer) {
              btnClasses += "border-emerald-600 bg-emerald-50 text-emerald-900 font-bold";
            } else if (userPick === key) {
              btnClasses += "border-rose-600 bg-rose-50 text-rose-900 font-bold";
            } else {
              btnClasses += "border-slate-200 bg-slate-50 opacity-60";
            }
          } else {
            btnClasses += "border-slate-200 bg-slate-50";
          }
        }

        btn.className = btnClasses;
        btn.innerHTML = `<span class="font-bold mr-2">${key}.</span> <span>${val}</span>`;
        btn.onclick = () => selectOption(q.id, key);
        container.appendChild(btn);
      });

      const practiceBox = document.getElementById('testPracticeBox');
      if (activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id]) {
        practiceBox.classList.remove('hidden');
        practiceBox.className = userPick === q.correctAnswer ? 'p-3 rounded-xl text-xs border border-emerald-200 bg-emerald-50 text-emerald-900' : 'p-3 rounded-xl text-xs border border-rose-200 bg-rose-50 text-rose-900';
        practiceBox.innerHTML = `<p class="whitespace-pre-line leading-relaxed"><strong>Explanation:</strong> ${q.explanation || 'Direct answer.'}</p>`;
      } else {
        practiceBox.classList.add('hidden');
      }

      document.getElementById('testPrevBtn').disabled = isFirst;
      if (isLast) {
        document.getElementById('testNextBtn').classList.add('hidden');
        document.getElementById('testSubmitBtn').classList.remove('hidden');
      } else {
        document.getElementById('testNextBtn').classList.remove('hidden');
        document.getElementById('testSubmitBtn').classList.add('hidden');
      }
    }

    function selectOption(qId, key) {
      activeExam.answers[qId] = key;
      if (activeExam.mode === 'practice') activeExam.practiceRevealed[qId] = true;
      renderQuestion();
    }

    function navigateQuestion(offset) {
      activeExam.currentIndex += offset;
      renderQuestion();
    }

    function confirmSubmitTest() {
      confirmDialog('Submit Test', 'Submit your assessment?', finishTest);
    }

    function finishTest() {
      clearInterval(activeExam.timerInterval);
      document.getElementById('navTimerBadge').classList.add('hidden');

      let obtainedMarks = 0;
      activeExam.questions.forEach(q => {
        if (activeExam.answers[q.id] === q.correctAnswer) obtainedMarks++;
      });

      const totalMarks = activeExam.questions.length;
      const percentage = Math.round((obtainedMarks / totalMarks) * 100) || 0;

      router.navigate('result-screen', { resultData: { obtainedMarks, totalMarks, percentage } });
    }

    // Auto load on start
    window.addEventListener('DOMContentLoaded', () => {
      router.navigate('home');
    });
  </script>
