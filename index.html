<!DOCTYPE html>
<html lang="or" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SATYAPEETH — BSE Odisha CBT Portal</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 900: '#1e1b4b', 950: '#0f172a' }
          }

      }

  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Oriya:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase App & Firestore SDKs (Compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans Oriya', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @media print {
      body * { visibility: hidden; }
      #printableCertificate, #printableCertificate * { visibility: visible; }
      #printableCertificate { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="h-full flex flex-col bg-white text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased custom-scrollbar transition-colors duration-200">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed top-3 right-3 left-3 sm:left-auto z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Global Header -->
  <header class="bg-indigo-950 text-white sticky top-0 z-40 border-b border-indigo-900 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <!-- Logo -->
      <div class="flex items-center gap-2 sm:gap-3 cursor-pointer select-none" onclick="router.navigate('home')">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-indigo-950 font-black text-sm sm:text-xl shadow-inner">
          SP
        </div>
        <div>
          <span class="text-base sm:text-xl font-black tracking-wider text-amber-400">SATYAPEETH</span>
          <span class="hidden md:inline-block text-[10px] text-indigo-200 uppercase tracking-widest font-semibold ml-2 border-l border-indigo-700 pl-2">Odisha Board Prep</span>
        </div>
      </div>

      <!-- Theme, Parent, Auth Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="toggleTheme()" id="themeToggleBtn" class="p-1.5 sm:p-2 rounded-xl bg-indigo-900/80 hover:bg-indigo-800 border border-indigo-700 text-amber-400 transition" title="Toggle Theme">
          <i id="themeIcon" class="fa-solid fa-moon text-xs sm:text-sm"></i>
        </button>

        <div id="navTimerBadge" class="hidden flex items-center gap-1.5 bg-rose-950/90 border border-rose-500 text-rose-300 px-2 py-1 rounded-lg text-xs font-mono font-bold animate-pulse">
          <i class="fa-solid fa-stopwatch"></i>
          <span id="navTimerVal">00:00</span>
        </div>

        <div id="navUserBadge" class="hidden flex items-center gap-1.5 bg-indigo-900 border border-indigo-700 px-2.5 py-1 rounded-lg text-xs">
          <i class="fa-solid fa-user-graduate text-amber-400 text-xs"></i>
          <span id="navUserName" class="font-bold text-white text-xs truncate max-w-[90px] sm:max-w-[140px]"></span>
          <span id="navUserType" class="px-1.5 py-0.5 rounded text-[9px] font-extrabold hidden sm:inline-block"></span>
        </div>

        <button id="navParentBtn" onclick="router.navigate('parent-portal')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2 sm:px-2.5 py-1.5 rounded-lg font-bold text-slate-200 transition">
          <i class="fa-solid fa-users text-amber-400 mr-1"></i> Parent
        </button>
        <button id="navLoginBtn" onclick="router.navigate('login')" class="text-xs bg-indigo-800 hover:bg-indigo-700 border border-indigo-600 px-2.5 sm:px-3 py-1.5 rounded-lg font-bold text-white transition">
          Login
        </button>
        <button id="navRegBtn" onclick="router.navigate('register-free')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-1.5 rounded-lg font-bold transition">
          Register
        </button>
        <button id="navAdmBtn" onclick="router.navigate('admission')" class="text-xs bg-amber-500 hover:bg-amber-400 text-indigo-950 px-2.5 sm:px-3 py-1.5 rounded-lg font-extrabold transition">
          Admission
        </button>
        <button id="navLogoutBtn" onclick="auth.logout()" class="hidden text-xs bg-slate-800 hover:bg-rose-900 border border-slate-700 text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg font-bold transition" title="Log Out">
          <i class="fa-solid fa-power-off"></i>
        </button>
        <button id="navAdminBtn" onclick="router.navigate('admin-auth')" class="text-xs bg-indigo-900/60 hover:bg-indigo-900 border border-indigo-800 text-indigo-300 hover:text-white px-2 py-1.5 rounded-lg transition" title="Admin Room">
          <i class="fa-solid fa-shield-halved"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- App Main Router View -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6"></main>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 max-w-sm w-full rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-800 p-5 text-center">
      <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400 flex items-center justify-center mx-auto mb-3 text-lg">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 id="confirmTitle" class="text-base font-bold text-slate-900 dark:text-white mb-1">Confirm Action</h3>
      <p id="confirmMsg" class="text-xs text-slate-600 dark:text-slate-400 mb-5 leading-relaxed"></p>
      <div class="flex gap-2">
        <button id="confirmCancelBtn" class="flex-1 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs transition">Cancel</button>
        <button id="confirmOkBtn" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 py-6 border-t border-slate-200 dark:border-slate-800 text-xs text-center">
    <div class="max-w-7xl mx-auto px-4 space-y-3">
      <div class="flex justify-center gap-5 text-sm">
        <a href="https://youtube.com/@satyapeethofficial?si=CYEuHtru53hpw9HP" target="_blank" rel="noopener noreferrer" class="text-rose-600 dark:text-rose-400 hover:opacity-80 transition flex items-center gap-1.5 font-bold">
          <i class="fa-brands fa-youtube text-base"></i> YouTube Channel
        </a>
        <a href="https://www.instagram.com/satyapeeth_?igsi=eHh5d3pia2RwNnVo" target="_blank" rel="noopener noreferrer" class="text-pink-600 dark:text-pink-400 hover:opacity-80 transition flex items-center gap-1.5 font-bold">
          <i class="fa-brands fa-instagram text-base"></i> Instagram Page
        </a>
      </div>
      <p>&copy; 2026 <strong>SATYAPEETH</strong> — BSE Odisha Examination & Learning Network | Admin: Satyajeet Sahu</p>
    </div>
  </footer>

  <script>
    /**
     * FIREBASE CONFIGURATION
     */
    const firebaseConfig = {
      apiKey: "AIzaSyClZPVVbeaz43l-SRYSRE0O504Lc4vEMLE",
      authDomain: "satyapeeth-d1fe1.firebaseapp.com",
      projectId: "satyapeeth-d1fe1",
      storageBucket: "satyapeeth-d1fe1.firebasestorage.app",
      messagingSenderId: "393666660094",
      appId: "1:393666660094:web:6484724ab9035b38bd47af",
      measurementId: "G-Y9WN2HDHRK"
    };

    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();
    const ADMIN_PHONE = "919556576071";

    const DB_KEYS = {
      AUTH_STUDENT: 'sp_persistent_student_v3',
      AUTH_ADMIN: 'sp_persistent_admin_v3',
      AUTH_PARENT: 'sp_persistent_parent_v3',
      CLASSES: 'sp_classes_cache',
      THEME: 'sp_theme_pref'
    };

    // Dark/Light Theme Handler
    function initTheme() {
      const savedTheme = localStorage.getItem(DB_KEYS.THEME) || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-400 text-xs sm:text-sm';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-moon text-amber-400 text-xs sm:text-sm';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(DB_KEYS.THEME, isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-amber-400 text-xs sm:text-sm' : 'fa-solid fa-moon text-amber-400 text-xs sm:text-sm';
    }

    // In-memory Cloud Cache
    let cloudState = {
      students: [],
      admissions: [],
      registrations: [],
      results: [],
      subjects: [
        { id: "sub_10_soc", class: "10", name: "Social Science (ଇତିହାସ ଓ ଭୂଗୋଳ)" },
        { id: "sub_10_fl_odia", class: "10", name: "First Language Odia (ସାହିତ୍ୟ ସିନ୍ଧୁ)" },
        { id: "sub_10_ps", class: "10", name: "Physical Science (ଭୌତିକ ବିଜ୍ଞାନ)" },
        { id: "sub_10_ls", class: "10", name: "Life Science (ଜୀବ ବିଜ୍ଞାନ)" },
        { id: "sub_10_mth", class: "10", name: "Mathematics (ଜ୍ୟାମିତି ଓ ବୀଜଗଣିତ)" },
        { id: "sub_10_eng", class: "10", name: "English" }
      ],
      topics: [
        { id: "top_10_soc_1", class: "10", subjectId: "sub_10_soc", name: "ଭାରତୀୟ ଜାତୀୟ ଆନ୍ଦୋଳନରେ ଗାନ୍ଧିଜୀଙ୍କ ଆବିର୍ଭାବ", isDemo: true },
        { id: "top_10_soc_2", class: "10", subjectId: "sub_10_soc", name: "ଅସହଯୋଗ ଆନ୍ଦୋଳନ ଓ ଓଡ଼ିଶାର ଭୂମିକା", isDemo: false },
        { id: "top_10_ps_1", class: "10", subjectId: "sub_10_ps", name: "ରାସାୟନିକ ପ୍ରତିକ୍ରିୟା ଓ ସମୀକରଣ", isDemo: true }
      ],
      questions: [],
      notes: []
    };

    // Initialize Realtime Listeners
    function initRealtimeSync() {
      firestore.collection("students").onSnapshot(snapshot => {
        cloudState.students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (router.currentRoute === 'admin-dashboard') router.navigate('admin-dashboard', { tab: 'students' });
      });

      firestore.collection("admissions").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        cloudState.admissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (router.currentRoute === 'admin-dashboard') router.navigate('admin-dashboard', { tab: 'admissions' });
      });

      firestore.collection("registrations").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        cloudState.registrations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (router.currentRoute === 'admin-dashboard') router.navigate('admin-dashboard', { tab: 'registrations' });
      });

      firestore.collection("results").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        cloudState.results = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (router.currentRoute === 'admin-dashboard') router.navigate('admin-dashboard', { tab: 'results' });
      });

      firestore.collection("subjects").onSnapshot(snapshot => {
        if (!snapshot.empty) cloudState.subjects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });

      firestore.collection("topics").onSnapshot(snapshot => {
        if (!snapshot.empty) cloudState.topics = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });

      firestore.collection("questions").onSnapshot(snapshot => {
        cloudState.questions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });

      firestore.collection("notes").onSnapshot(snapshot => {
        cloudState.notes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });
    }

    function toast(title, msg, type = 'info') {
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-indigo-600 text-white'
      };
      const toastEl = document.createElement('div');
      toastEl.className = `${colors[type]} p-3 rounded-xl shadow-xl flex items-start gap-2.5 pointer-events-auto transition max-w-sm border border-white/20 text-xs`;
      toastEl.innerHTML = `<div><h4 class="font-bold">${title}</h4><p class="opacity-90 mt-0.5">${msg}</p></div>`;
      document.getElementById('toastContainer').appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toastEl.remove(), 250);
      }, 3500);
    }

    function confirmDialog(title, msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMsg').innerText = msg;
      modal.classList.remove('hidden');

      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

    // WhatsApp Notification Trigger
    function sendWhatsAppNotification(type, payload) {
      let text = "";
      if (type === 'registration') {
        text = `🔔 *New Free Mock Registration (Satyapeeth)*%0A%0A👤 *Name:* ${payload.name}%0A📚 *Class:* ${payload.class}%0A📱 *Phone:* ${payload.phone}%0A📧 *Email:* ${payload.email}`;
      } else if (type === 'admission') {
        text = `🌟 *New Full Admission Application (Satyapeeth)*%0A%0A👤 *Student:* ${payload.name}%0A👨‍👩‍👦 *Guardian:* ${payload.guardian}%0A📚 *Class:* ${payload.class}%0A📱 *Phone:* ${payload.phone}%0A🏫 *School:* ${payload.school}`;
      }
      const url = `https://api.whatsapp.com/send?phone=${ADMIN_PHONE}&text=${text}`;
      window.open(url, '_blank');
    }

    // Persistent Auth
    const auth = {
      getStudent: () => {
        try { return JSON.parse(localStorage.getItem(DB_KEYS.AUTH_STUDENT)); } catch (e) { return null; }
      },
      getAdmin: () => {
        try { return JSON.parse(localStorage.getItem(DB_KEYS.AUTH_ADMIN)); } catch (e) { return null; }
      },
      getParent: () => {
        try { return JSON.parse(localStorage.getItem(DB_KEYS.AUTH_PARENT)); } catch (e) { return null; }
      },
      isGuest: () => localStorage.getItem('sp_guest_flag') === 'true',
      setStudent: (data) => {
        localStorage.removeItem('sp_guest_flag');
        localStorage.setItem(DB_KEYS.AUTH_STUDENT, JSON.stringify(data));
      },
      setAdmin: (data) => localStorage.setItem(DB_KEYS.AUTH_ADMIN, JSON.stringify(data)),
      setParent: (data) => localStorage.setItem(DB_KEYS.AUTH_PARENT, JSON.stringify(data)),
      logout: () => {
        confirmDialog('Log Out', 'Are you sure you want to log out?', () => {
          localStorage.removeItem(DB_KEYS.AUTH_STUDENT);
          localStorage.removeItem(DB_KEYS.AUTH_ADMIN);
          localStorage.removeItem(DB_KEYS.AUTH_PARENT);
          localStorage.removeItem('sp_guest_flag');
          router.updateHeader();
          toast('Logged Out', 'Session closed.', 'info');
          router.navigate('home');
        });
      }
    };

    let activeExam = {
      mode: 'exam',
      subject: null,
      topic: null,
      questions: [],
      currentIndex: 0,
      answers: {},
      practiceRevealed: {},
      timerInterval: null,
      timeLeft: 600
    };

    const router = {
      currentRoute: 'home',
      updateHeader: () => {
        const student = auth.getStudent();
        const admin = auth.getAdmin();
        const parent = auth.getParent();
        const isGuest = auth.isGuest();
        const navUser = document.getElementById('navUserBadge');
        const loginBtn = document.getElementById('navLoginBtn');
        const regBtn = document.getElementById('navRegBtn');
        const admBtn = document.getElementById('navAdmBtn');
        const logoutBtn = document.getElementById('navLogoutBtn');

        if (student) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = student.name;
          const badge = document.getElementById('navUserType');
          if (isGuest) {
            badge.className = "bg-amber-400 text-indigo-950 px-1.5 py-0.5 rounded text-[9px] font-extrabold";
            badge.innerText = "Guest";
          } else if (student.type === 'Admission') {
            badge.className = "bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[9px] font-black";
            badge.innerText = "All Access";
          } else {
            badge.className = "bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold";
            badge.innerText = "Mock Pass";
          }
          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else if (parent) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = "Parent: " + parent.phone;
          const badge = document.getElementById('navUserType');
          badge.className = "bg-teal-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold";
          badge.innerText = "Parent";
          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else if (admin) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = "Satyajeet Sahu";
          const badge = document.getElementById('navUserType');
          badge.className = "bg-rose-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold";
          badge.innerText = "Admin";
          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else {
          navUser.classList.add('hidden');
          loginBtn.classList.remove('hidden');
          regBtn.classList.remove('hidden');
          admBtn.classList.remove('hidden');
          logoutBtn.classList.add('hidden');
        }
      },

      navigate: (viewName, params = {}) => {
        router.currentRoute = viewName;
        router.updateHeader();
        const app = document.getElementById('app');

        if (viewName.startsWith('admin-dashboard') && !auth.getAdmin()) {
          toast('Admin Only', 'Please login with Master Credentials.', 'error');
          return router.navigate('admin-auth');
        }
        if (['student-dashboard', 'subject-select', 'topic-select', 'mode-select', 'test-screen', 'result-screen', 'notes-view'].includes(viewName) && !auth.getStudent()) {
          toast('Login Required', 'Please sign in to continue.', 'warning');
          return router.navigate('login');
        }

        switch (viewName) {
          case 'home': app.innerHTML = views.home(); break;
          case 'register-free': app.innerHTML = views.registerFree(); break;
          case 'admission': app.innerHTML = views.admission(); break;
          case 'login': app.innerHTML = views.login(); break;
          case 'parent-portal': app.innerHTML = views.parentPortal(); break;
          case 'student-dashboard': app.innerHTML = views.studentDashboard(); break;
          case 'subject-select': app.innerHTML = views.subjectSelect(); break;
          case 'topic-select': app.innerHTML = views.topicSelect(params.subjectId); break;
          case 'mode-select': app.innerHTML = views.modeSelect(params.subjectId, params.topicId); break;
          case 'test-screen': app.innerHTML = views.testScreen(); renderQuestion(); break;
          case 'result-screen': app.innerHTML = views.resultScreen(params.resultData); break;
          case 'notes-view': app.innerHTML = views.notesView(params.topicId); break;
          case 'admin-auth': app.innerHTML = views.adminAuth(); break;
          case 'admin-dashboard':
            app.innerHTML = views.adminDashboard(params.tab || 'html-upload');
            if ((params.tab || 'html-upload') === 'html-upload') {
              setTimeout(updateImporterSubjects, 50);
            } else if ((params.tab || 'html-upload') === 'single-q') {
              setTimeout(updateSingleQSubjects, 50);
            } else if ((params.tab || 'html-upload') === 'notes-admin') {
              setTimeout(updateNotesSubjects, 50);
            }
            break;
          default: app.innerHTML = views.home();
        }
        window.scrollTo(0, 0);
      }
    };

    const views = {
      home: () => `
        <div class="space-y-6">
          <div class="bg-gradient-to-br from-indigo-950 via-indigo-900 to-slate-900 text-white rounded-3xl p-6 sm:p-10 shadow-xl border border-indigo-800 text-center sm:text-left">
            <span class="inline-block bg-amber-400/20 text-amber-300 border border-amber-400/30 text-[11px] font-bold px-3 py-0.5 rounded-full uppercase">
              BSE Odisha Board Curriculum (Class 6 - 10)
            </span>
            <h1 class="text-2xl sm:text-4xl font-black mt-3 leading-tight">
              Satyapeeth Online CBT & Smart Learning Portal
            </h1>
            <p class="text-indigo-200 text-xs sm:text-sm mt-2 max-w-xl leading-relaxed">

    function handleHtmlImport(e) {
      e.preventDefault();
      const cls = document.getElementById('impClassSelect').value;
      const subId = document.getElementById('impSubjectSelect').value;
      const topId = document.getElementById('impTopicSelect').value;
      const htmlCode = document.getElementById('impHtmlCode').value;

      if (!subId || !topId) return alert("Select Subject & Chapter first!");

      try {
        let extractedQuestions = [];
        const jsMatch = htmlCode.match(/questionsData\s*=\s*(\[[\s\S]*?\]);/);
        
        if (jsMatch && jsMatch[1]) {
          const rawParsed = Function('"use strict";return (' + jsMatch[1] + ')')();
          rawParsed.forEach(q => {
            extractedQuestions.push({
              class: cls,
              subjectId: subId,
              topicId: topId,
              question: q.qEn || q.question || "Question",
              questionOdia: q.qOr || q.questionOdia || "",
              options: q.options || { A: "", B: "", C: "", D: "" },
              correctAnswer: q.ans || q.correctAnswer || "A",
              explanation: (q.expOr || "") + "\n" + (q.expEn || q.explanation || "") + (q.analysis ? "\n" + q.analysis.join("\n") : ""),
              marks: 1
            });
          });
        }

        if (extractedQuestions.length === 0) throw new Error("No questionsData found in code.");

        const batch = firestore.batch();
        extractedQuestions.forEach(q => {
          const docRef = firestore.collection("questions").doc();
          batch.set(docRef, q);
        });

        batch.commit().then(() => {
          toast("Success!", `Loaded ${extractedQuestions.length} questions into Cloud DB.`, "success");
          router.navigate('admin-dashboard', { tab: 'questions' });
        });

      } catch (err) {
        toast("Parse Error", err.message, "error");
      }
    }

    function startTestEngine(subjectId, topicId, mode) {
      const subject = cloudState.subjects.find(s => s.id === subjectId);
      const topic = cloudState.topics.find(t => t.id === topicId);
      let questions = cloudState.questions.filter(q => q.topicId === topicId);

      if (questions.length === 0) {
        questions = [
          {
            id: "q_demo_1",
            question: "Sample Objective Question",
            questionOdia: "ପ୍ରଶ୍ନ ଉପଲବ୍ଧ ନାହିଁ । (Upload questions from Admin Smart HTML Parser)",
            options: { A: "Option A", B: "Option B", C: "Option C", D: "Option D" },
            correctAnswer: "A",
            explanation: "Questions uploaded via the Admin Parser will automatically show up here."
          }
        ];
      }

      activeExam = {
        mode,
        subject,
        topic,
        questions,
        currentIndex: 0,
        answers: {},
        practiceRevealed: {},
        timeLeft: 600
      };

      const navTimer = document.getElementById('navTimerBadge');
      if (mode === 'exam') {
        navTimer.classList.remove('hidden');
        startTimer();
      } else {
        navTimer.classList.add('hidden');
      }
      router.navigate('test-screen');

    function startTimer() {
      clearInterval(activeExam.timerInterval);
      activeExam.timerInterval = setInterval(() => {
        activeExam.timeLeft--;
        const m = Math.floor(activeExam.timeLeft / 60);
        const s = activeExam.timeLeft % 60;
        const navTimerVal = document.getElementById('navTimerVal');
        if (navTimerVal) navTimerVal.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        if (activeExam.timeLeft <= 0) {
          clearInterval(activeExam.timerInterval);
          finishTest();
        }
      }, 1000);
    }

    function renderQuestion() {
      const q = activeExam.questions[activeExam.currentIndex];
      const isLast = activeExam.currentIndex === activeExam.questions.length - 1;
      const isFirst = activeExam.currentIndex === 0;

      document.getElementById('testMetaMode').innerText = activeExam.mode === 'exam' ? 'CBT Exam' : 'Practice';
      document.getElementById('testMetaMode').className = `font-bold uppercase px-2.5 py-1 rounded text-xs ${activeExam.mode === 'exam' ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'}`;
      document.getElementById('testMetaProgress').innerText = `${activeExam.currentIndex + 1} / ${activeExam.questions.length}`;
      document.getElementById('testQEn').innerText = `Q${activeExam.currentIndex + 1}. ${q.question}`;
      document.getElementById('testQOr').innerText = q.questionOdia || '';

      const container = document.getElementById('testOptionsBox');
      container.innerHTML = '';
      const userPick = activeExam.answers[q.id];

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        let btnClasses = "w-full p-3.5 rounded-2xl border text-left font-medium text-xs sm:text-sm flex items-center justify-between transition leading-relaxed ";

        if (activeExam.mode === 'exam') {
          btnClasses += userPick === key 
            ? "border-indigo-600 bg-indigo-600 text-white font-bold shadow" 
            : "border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 hover:border-indigo-400";
        } else {
          if (activeExam.practiceRevealed[q.id]) {
            if (key === q.correctAnswer) {
              btnClasses += "border-emerald-600 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-300 font-bold";
            } else if (userPick === key) {
              btnClasses += "border-rose-600 bg-rose-50 dark:bg-rose-950/60 text-rose-900 dark:text-rose-300 font-bold";
            } else {
              btnClasses += "border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 opacity-50 text-slate-700 dark:text-slate-300";
            }
          } else {
            btnClasses += "border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200";
          }
        }

        btn.className = btnClasses;
        btn.innerHTML = `<span class="font-bold mr-2.5 text-sm">${key}.</span> <span class="flex-1">${val}</span>`;
        btn.onclick = () => selectOption(q.id, key);
        container.appendChild(btn);
      });

      const practiceBox = document.getElementById('testPracticeBox');
      if (activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id]) {
        practiceBox.classList.remove('hidden');
        practiceBox.className = userPick === q.correctAnswer 
          ? 'p-4 rounded-2xl text-xs sm:text-sm border border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-200' 
          : 'p-4 rounded-2xl text-xs sm:text-sm border border-rose-200 dark:border-rose-800 bg-rose-50 dark:bg-rose-950/60 text-rose-900 dark:text-rose-200';
        practiceBox.innerHTML = `<p class="whitespace-pre-line leading-relaxed"><strong>Explanation:</strong> ${q.explanation || 'Direct factual question.'}</p>`;
      } else {
        practiceBox.classList.add('hidden');
      }

      document.getElementById('testPrevBtn').disabled = isFirst;
      if (isLast) {
        document.getElementById('testNextBtn').classList.add('hidden');
        document.getElementById('testSubmitBtn').classList.remove('hidden');
      } else {
        document.getElementById('testNextBtn').classList.remove('hidden');
        document.getElementById('testSubmitBtn').classList.add('hidden');
      }
    }

    function selectOption(qId, key) {
      activeExam.answers[qId] = key;
      if (activeExam.mode === 'practice') activeExam.practiceRevealed[qId] = true;
      renderQuestion();
    }

    function navigateQuestion(offset) {
      activeExam.currentIndex += offset;
      renderQuestion();
    }

    function confirmSubmitTest() {
      confirmDialog('Submit Test', 'Submit your assessment?', finishTest);
    }

    function finishTest() {
      clearInterval(activeExam.timerInterval);
      document.getElementById('navTimerBadge').classList.add('hidden');

      let obtainedMarks = 0;
      activeExam.questions.forEach(q => {
        if (activeExam.answers[q.id] === q.correctAnswer) obtainedMarks++;
      });

      const totalMarks = activeExam.questions.length;
      const percentage = Math.round((obtainedMarks / totalMarks) * 100) || 0;
      const student = auth.getStudent() || { name: "Guest Student", class: "10", phone: "9876543210", email: "guest@satyapeeth.in", guardian: "Guest Parent" };

      const resultPayload = {
        studentName: student.name,
        studentClass: student.class,
        studentPhone: student.phone || '',
        parentPhone: student.phone || '',
        parentName: student.guardian || 'Guardian',
        studentEmail: student.email || '',
        subjectName: activeExam.subject ? activeExam.subject.name : 'All Subjects',
        topicName: activeExam.topic ? activeExam.topic.name : 'Chapter Test',
        obtainedMarks,
        totalMarks,
        percentage,
        certificateId: "SP-CERT-" + Date.now().toString().slice(-6),
        date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };

      firestore.collection("results").add(resultPayload).then(docRef => {
        router.navigate('result-screen', { resultData: { id: docRef.id, ...resultPayload } });
      });
    }

    // Dynamic Certificate Modal
    function openCertificateModal(resultId) {
      const res = cloudState.results.find(r => r.id === resultId);
      if (!res) return;

      const certHtml = `
        <div id="certModalBackdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 overflow-y-auto">
          <div class="max-w-xl w-full bg-[#fdfdfb] text-slate-900 rounded-3xl p-6 sm:p-8 shadow-2xl border-4 border-amber-400 relative space-y-5" id="printableCertificate">
            
            <div class="border-2 border-indigo-950 p-5 rounded-2xl relative space-y-4">
              <div class="flex justify-between items-center">
                <div class="w-8 h-8 rounded-lg bg-indigo-950 text-amber-400 flex items-center justify-center font-cinzel font-black text-sm">
                  SP
                </div>
                <div class="text-center">
                  <h2 class="font-cinzel text-xl sm:text-2xl font-black tracking-widest text-indigo-950">SATYAPEETH</h2>
                  <p class="text-[10px] uppercase font-bold tracking-widest text-amber-700">Certificate of Achievement</p>
                </div>
                <i class="fa-solid fa-award text-2xl text-amber-500"></i>
              </div>

              <div class="text-center space-y-2 py-3">
                <p class="text-xs italic text-slate-600">This certificate is proudly presented to</p>
                <h3 class="text-xl sm:text-2xl font-black text-indigo-950 border-b-2 border-amber-400 pb-1 inline-block uppercase tracking-wide">
                  ${res.studentName}
                </h3>
                <p class="text-xs text-slate-700 leading-relaxed max-w-sm mx-auto">
                  For successfully demonstrating academic excellence in <br><strong class="text-indigo-950">${res.topicName}</strong> with a score of <strong>${res.percentage}%</strong>.
                </p>
              </div>

              <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-600 border-t border-slate-200 pt-3">
                <p><strong>Parent Name:</strong> ${res.parentName}</p>
                <p><strong>Email ID:</strong> ${res.studentEmail}</p>
                <p><strong>Date:</strong> ${res.date}</p>
                <p><strong>Certificate ID:</strong> <span class="font-mono text-indigo-950 font-bold">${res.certificateId}</span></p>
              </div>

              <div class="flex justify-between items-end pt-4">
                <div class="text-left text-[9px] text-slate-400">
                  <p>BSE Odisha Curriculum</p>
                  <p>Verified Academic Credential</p>
                </div>
                <div class="text-right">
                  <div class="font-serif italic font-bold text-xs text-indigo-950 border-b border-slate-400 pb-0.5">Satyajeet Sahu</div>
                  <p class="text-[9px] uppercase tracking-wider font-bold text-slate-600">Authorized Signature</p>
                </div>
              </div>
            </div>

            <div class="flex gap-2 print:hidden">
              <button onclick="window.print()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black rounded-xl text-xs transition shadow flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-print"></i> Print / Download
              </button>
              <button onclick="document.getElementById('certModalBackdrop').remove()" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl text-xs transition">
                Close
              </button>
            </div>

          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', certHtml);
    }

    // App Initialization
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initRealtimeSync();

      if (auth.getStudent()) {
        router.navigate('student-dashboard');
      } else if (auth.getAdmin()) {
        router.navigate('admin-dashboard');
      } else if (auth.getParent()) {
        router.navigate('parent-portal');
      } else {
        router.navigate('home');
      }
    });
  </script>
</body>
</html>
