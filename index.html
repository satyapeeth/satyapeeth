          Login

        <button id="navRegBtn" onclick="router.navigate('register-free')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-1.5 rounded-lg font-bold transition">
          Register

        <button id="navAdmBtn" onclick="router.navigate('admission')" class="text-xs bg-amber-500 hover:bg-amber-400 text-indigo-950 px-2.5 sm:px-3 py-1.5 rounded-lg font-extrabold transition">
          Admission

      </div>
      <p>&copy; 2026 <strong>SATYAPEETH</strong> — BSE Odisha Examination & Learning Network</p>
    </div>

  <script>
    /**

     */
    const firebaseConfig = {
      apiKey: "AIzaSyClZPVVbeaz43l-SRYSRE0O504Lc4vEMLE",
      authDomain: "satyapeeth-d1fe1.firebaseapp.com",
      projectId: "satyapeeth-d1fe1",
      storageBucket: "satyapeeth-d1fe1.firebasestorage.app",
      messagingSenderId: "393666660094",
      appId: "1:393666660094:web:6484724ab9035b38bd47af",
      measurementId: "G-Y9WN2HDHRK"
    };

    firebase.initializeApp(firebaseConfig);

    const DB_KEYS = {
      AUTH_STUDENT: 'sp_cloud_student',
      AUTH_ADMIN: 'sp_cloud_admin',
      CLASSES: 'sp_classes_cache'
    };

    const SEED_CLASSES = ["10", "9", "8", "7", "6"];

    // In-memory Realtime Cloud Cache
    let cloudState = {
      students: [],
      admissions: [],
      registrations: [],
      subjects: [
        { id: "sub_10_soc", class: "10", name: "Social Science (ଇତିହାସ ଓ ଭୂଗୋଳ)" },
        { id: "sub_10_fl_odia", class: "10", name: "First Language Odia (ସାହିତ୍ୟ ସିନ୍ଧୁ)" },
        { id: "sub_10_ps", class: "10", name: "Physical Science (ଭୌତିକ ବିଜ୍ଞାନ)" },
        { id: "sub_10_ls", class: "10", name: "Life Science (ଜୀବ ବିଜ୍ଞାନ)" },
        { id: "sub_10_mth", class: "10", name: "Mathematics (ଜ୍ୟାମିତି ଓ ବୀଜଗଣିତ)" },
        { id: "sub_10_eng", class: "10", name: "English" }
      ],
      topics: [
        { id: "top_10_soc_1", class: "10", subjectId: "sub_10_soc", name: "ଭାରତୀୟ ଜାତୀୟ ଆନ୍ଦୋଳନରେ ଗାନ୍ଧିଜୀଙ୍କ ଆବିର୍ଭାବ", isDemo: true },
        { id: "top_10_soc_2", class: "10", subjectId: "sub_10_soc", name: "ଅସହଯୋଗ ଆନ୍ଦୋଳନ ଓ ଓଡ଼ିଶାର ଭୂମିକା", isDemo: false },
        { id: "top_10_ps_1", class: "10", subjectId: "sub_10_ps", name: "ରାସାୟନିକ ପ୍ରତିକ୍ରିୟା ଓ ସମୀକରଣ", isDemo: true }
      ],
      questions: [],
      notes: []
    };

    // Initialize Realtime Listeners with Cloud Firestore
    function initRealtimeSync() {
      firestore.collection("students").onSnapshot(snapshot => {
        cloudState.students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (router.currentRoute === 'admin-dashboard') router.navigate('admin-dashboard', { tab: 'students' });
      });

      firestore.collection("admissions").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        cloudState.admissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (router.currentRoute === 'admin-dashboard') router.navigate('admin-dashboard', { tab: 'admissions' });
      });

      firestore.collection("registrations").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        cloudState.registrations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (router.currentRoute === 'admin-dashboard') router.navigate('admin-dashboard', { tab: 'registrations' });
      });

      firestore.collection("subjects").onSnapshot(snapshot => {
        if (!snapshot.empty) cloudState.subjects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });

      firestore.collection("topics").onSnapshot(snapshot => {
        if (!snapshot.empty) cloudState.topics = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });

      firestore.collection("questions").onSnapshot(snapshot => {
        cloudState.questions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });
    }

    function toast(title, msg, type = 'info') {
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-indigo-600 text-white'
      };
      const toastEl = document.createElement('div');
      toastEl.className = `${colors[type]} p-3 rounded-xl shadow-xl flex items-start gap-2.5 pointer-events-auto transition max-w-sm border border-white/20 text-xs`;
      toastEl.innerHTML = `<div><h4 class="font-bold">${title}</h4><p class="opacity-90 mt-0.5">${msg}</p></div>`;
      document.getElementById('toastContainer').appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toastEl.remove(), 250);
      }, 3500);
    }

    function confirmDialog(title, msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMsg').innerText = msg;
      modal.classList.remove('hidden');

      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

    // Authentication Controller
    const auth = {
      getStudent: () => JSON.parse(localStorage.getItem(DB_KEYS.AUTH_STUDENT)),
      getAdmin: () => JSON.parse(localStorage.getItem(DB_KEYS.AUTH_ADMIN)),
      isGuest: () => localStorage.getItem('sp_guest_flag') === 'true',
      setStudent: (data) => {
        localStorage.removeItem('sp_guest_flag');
        localStorage.setItem(DB_KEYS.AUTH_STUDENT, JSON.stringify(data));
      },
      setAdmin: (data) => localStorage.setItem(DB_KEYS.AUTH_ADMIN, JSON.stringify(data)),
      logout: () => {
        localStorage.removeItem(DB_KEYS.AUTH_STUDENT);
        localStorage.removeItem(DB_KEYS.AUTH_ADMIN);
        localStorage.removeItem('sp_guest_flag');
        router.updateHeader();
        toast('Logged Out', 'Session closed successfully.', 'info');
        router.navigate('home');
      }
    };

    let activeExam = {
      mode: 'exam',
      subject: null,
      topic: null,
      questions: [],
      currentIndex: 0,
      answers: {},
      practiceRevealed: {},
      timerInterval: null,
      timeLeft: 600
    };

    const router = {
      currentRoute: 'home',
      updateHeader: () => {
        const student = auth.getStudent();
        const admin = auth.getAdmin();
        const isGuest = auth.isGuest();
        const navUser = document.getElementById('navUserBadge');
        const loginBtn = document.getElementById('navLoginBtn');
        const regBtn = document.getElementById('navRegBtn');
        const admBtn = document.getElementById('navAdmBtn');
        const logoutBtn = document.getElementById('navLogoutBtn');

        if (student) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = student.name;
          const badge = document.getElementById('navUserType');
          if (isGuest) {
            badge.className = "bg-amber-400 text-indigo-950 px-1.5 py-0.5 rounded text-[9px] font-extrabold";
            badge.innerText = "Guest";
          } else if (student.type === 'Admission') {
            badge.className = "bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[9px] font-black";
            badge.innerText = "All Access";
          } else {
            badge.className = "bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold";
            badge.innerText = "Mock Pass";
          }
          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else if (admin) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = "Satyajeet Sahu";
          const badge = document.getElementById('navUserType');
          badge.className = "bg-rose-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold";
          badge.innerText = "Admin";
          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else {
          navUser.classList.add('hidden');
          loginBtn.classList.remove('hidden');
          regBtn.classList.remove('hidden');
          admBtn.classList.remove('hidden');
          logoutBtn.classList.add('hidden');
        }
      },

      navigate: (viewName, params = {}) => {
        router.currentRoute = viewName;
        router.updateHeader();
        const app = document.getElementById('app');

        if (viewName.startsWith('admin-dashboard') && !auth.getAdmin()) {
          toast('Admin Only', 'Please login with Master Credentials.', 'error');
          return router.navigate('admin-auth');
        }
        if (['student-dashboard', 'subject-select', 'topic-select', 'mode-select', 'test-screen', 'result-screen', 'notes-view'].includes(viewName) && !auth.getStudent()) {
          toast('Login Required', 'Please login to continue.', 'warning');
          return router.navigate('login');
        }

        switch (viewName) {
          case 'home': app.innerHTML = views.home(); break;
          case 'register-free': app.innerHTML = views.registerFree(); break;
          case 'admission': app.innerHTML = views.admission(); break;
          case 'login': app.innerHTML = views.login(); break;
          case 'student-dashboard': app.innerHTML = views.studentDashboard(); break;
          case 'subject-select': app.innerHTML = views.subjectSelect(); break;
          case 'topic-select': app.innerHTML = views.topicSelect(params.subjectId); break;
          case 'mode-select': app.innerHTML = views.modeSelect(params.subjectId, params.topicId); break;
          case 'test-screen': app.innerHTML = views.testScreen(); renderQuestion(); break;
          case 'result-screen': app.innerHTML = views.resultScreen(params.resultData); break;
          case 'notes-view': app.innerHTML = views.notesView(params.topicId); break;
          case 'admin-auth': app.innerHTML = views.adminAuth(); break;
          case 'admin-dashboard':
            app.innerHTML = views.adminDashboard(params.tab || 'html-upload');
            if ((params.tab || 'html-upload') === 'html-upload') {
              setTimeout(updateImporterSubjects, 50);
            }
            break;
          default: app.innerHTML = views.home();
        }
        window.scrollTo(0, 0);
      }
    };

    const views = {
      home: () => `

            </span>
            <h1 class="text-2xl sm:text-4xl font-black mt-3 leading-tight">

              <button onclick="router.navigate('admission')" class="bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black px-4 py-2.5 rounded-xl shadow text-xs">
                Full Admission (Notes + Mocks)
              </button>
              <button onclick="router.navigate('register-free')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl shadow text-xs">
                Free Mock Register
              </button>
              <button onclick="guestLogin()" class="bg-indigo-900 border border-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs">
                Guest Demo
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg font-bold">
                <i class="fa-solid fa-stopwatch"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-sm">Real CBT Mock Engine</h3>
              <p class="text-xs text-slate-500 leading-relaxed">Timed mock exams without answers revealed during the test. Detailed scorecards provided at the end.</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg font-bold">

              </div>
              <h3 class="font-bold text-slate-900 text-sm">Interactive Practice Mode</h3>
              <p class="text-xs text-slate-500 leading-relaxed">Instant correct/incorrect feedback with bilingual Odia & English concept clarification.</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg font-bold">
                <i class="fa-solid fa-cloud-arrow-up"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-sm">Cloud Realtime Sync</h3>
              <p class="text-xs text-slate-500 leading-relaxed">Powered by Firebase Firestore. Mobile admissions and registrations sync directly with Admin.</p>
            </div>
          </div>

          <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-5 sm:p-6 rounded-3xl border border-indigo-900/60 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left space-y-1">
              <h4 class="font-black text-base text-amber-400">Join Official Satyapeeth Channels</h4>
              <p class="text-xs text-slate-300">Watch daily lessons and get study material on our YouTube & Instagram.</p>
            </div>
            <div class="flex gap-2.5">
              <a href="https://youtube.com/@satyapeethofficial?si=CYEuHtru53hpw9HP" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-brands fa-youtube text-sm"></i> YouTube
              </a>
              <a href="https://www.instagram.com/satyapeeth_?igsi=eHh5d3pia2RwNnVo" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-gradient-to-r from-pink-600 to-rose-500 hover:opacity-90 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-brands fa-instagram text-sm"></i> Instagram
              </a>
            </div>
          </div>
        </div>
      `,

      registerFree: () => `
        <div class="max-w-md mx-auto bg-white rounded-3xl p-5 sm:p-7 border border-slate-200 shadow-xl space-y-4">

                <select id="regClass" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold outline-none">

                  <option value="9">Class 9</option>
                  <option value="8">Class 8</option>
                  <option value="7">Class 7</option>
                  <option value="6">Class 6</option>
                </select>

    function updateImporterSubjects() {
      const clsSelect = document.getElementById('impClassSelect');
      if (!clsSelect) return;
      const cls = clsSelect.value;
      const subSelect = document.getElementById('impSubjectSelect');
      const subjects = cloudState.subjects.filter(s => String(s.class) === String(cls));

      subSelect.innerHTML = subjects.length > 0 
        ? subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('') 
        : '<option value="">-- No Subject Found (Add New Below) --</option>';

      updateImporterTopics();
    }

    function updateImporterTopics() {
      const subSelect = document.getElementById('impSubjectSelect');
      const topSelect = document.getElementById('impTopicSelect');
      if (!subSelect || !topSelect) return;
      const subId = subSelect.value;
      const topics = cloudState.topics.filter(t => t.subjectId === subId);

      topSelect.innerHTML = topics.length > 0 
        ? topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('') 
        : '<option value="">-- No Topic Found (Add New Below) --</option>';

    function handleHtmlImport(e) {
      e.preventDefault();
      const cls = document.getElementById('impClassSelect').value;
      const subId = document.getElementById('impSubjectSelect').value;
      const topId = document.getElementById('impTopicSelect').value;
      const htmlCode = document.getElementById('impHtmlCode').value;

      if (!subId || !topId) {
        return alert("Please select or add a Subject and Chapter/Topic first!");
      }

      try {
        let extractedQuestions = [];
        const jsMatch = htmlCode.match(/questionsData\s*=\s*(\[[\s\S]*?\]);/);
        
        if (jsMatch && jsMatch[1]) {
          const rawParsed = Function('"use strict";return (' + jsMatch[1] + ')')();
          rawParsed.forEach(q => {
            extractedQuestions.push({
              class: cls,
              subjectId: subId,
              topicId: topId,
              question: q.qEn || q.question || "Question",
              questionOdia: q.qOr || q.questionOdia || "",
              options: q.options || { A: "", B: "", C: "", D: "" },
              correctAnswer: q.ans || q.correctAnswer || "A",
              explanation: (q.expOr || "") + "\n" + (q.expEn || q.explanation || "") + (q.analysis ? "\n" + q.analysis.join("\n") : ""),
              marks: 1
            });
          });
        }

        if (extractedQuestions.length === 0) throw new Error("No questionsData found in code.");

        const batch = firestore.batch();
        extractedQuestions.forEach(q => {
          const docRef = firestore.collection("questions").doc();
          batch.set(docRef, q);
        });

        batch.commit().then(() => {
          toast("Success!", `Loaded ${extractedQuestions.length} questions into Cloud DB.`, "success");
          router.navigate('admin-dashboard', { tab: 'questions' });
        });

      } catch (err) {
        toast("Parse Error", err.message, "error");
      }
    }

    function approveStudent(type, docId) {
      const collection = type === 'adm' ? "admissions" : "registrations";
      const record = type === 'adm' 
        ? cloudState.admissions.find(a => a.id === docId)
        : cloudState.registrations.find(r => r.id === docId);

      const studentId = "SP" + record.class + "-" + Math.floor(1000 + Math.random() * 9000);
      const password = "PASS" + Math.floor(1000 + Math.random() * 9000);

      // 1. Update Application Status in Cloud
      firestore.collection(collection).doc(docId).update({
        status: "Approved",
        assignedStudentId: studentId
      });

      // 2. Create Enrolled Student in Cloud
      firestore.collection("students").add({
        studentId,
        name: record.name,
        class: record.class,
        phone: record.phone,
        email: record.email,
        password: password,
        type: type === 'adm' ? "Admission" : "Registration",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        toast('Approved!', `Student ID: ${studentId} & Password: ${password} generated.`, 'success');
      });
    }

    function startTestEngine(subjectId, topicId, mode) {
      const subject = cloudState.subjects.find(s => s.id === subjectId);
      const topic = cloudState.topics.find(t => t.id === topicId);
      let questions = cloudState.questions.filter(q => q.topicId === topicId);

      if (questions.length === 0) {
        questions = [
          {
            id: "q_demo_1",
            question: "Sample Assessment Question",
            questionOdia: "ପ୍ରଶ୍ନ ଉପଲବ୍ଧ ନାହିଁ । (Upload questions from Admin Smart HTML Parser)",
            options: { A: "Option A", B: "Option B", C: "Option C", D: "Option D" },
            correctAnswer: "A",
            explanation: "Questions uploaded via the Admin Parser will automatically show up here."
          }
        ];
      }

      activeExam = {
        mode,
        subject,
        topic,
        questions,
        currentIndex: 0,
        answers: {},
        practiceRevealed: {},
        timeLeft: 600
      };

      const navTimer = document.getElementById('navTimerBadge');
      if (mode === 'exam') {
        navTimer.classList.remove('hidden');
        startTimer();
      } else {
        navTimer.classList.add('hidden');
      }
      router.navigate('test-screen');
    }

    function startTimer() {
      clearInterval(activeExam.timerInterval);
      activeExam.timerInterval = setInterval(() => {
        activeExam.timeLeft--;
        const m = Math.floor(activeExam.timeLeft / 60);
        const s = activeExam.timeLeft % 60;
        const navTimerVal = document.getElementById('navTimerVal');
        if (navTimerVal) navTimerVal.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        if (activeExam.timeLeft <= 0) {
          clearInterval(activeExam.timerInterval);
          finishTest();
        }
      }, 1000);
    }

    function renderQuestion() {
      const q = activeExam.questions[activeExam.currentIndex];
      const isLast = activeExam.currentIndex === activeExam.questions.length - 1;
      const isFirst = activeExam.currentIndex === 0;

      document.getElementById('testMetaMode').innerText = activeExam.mode === 'exam' ? 'CBT Exam' : 'Practice';
      document.getElementById('testMetaMode').className = `font-bold uppercase px-2 py-0.5 rounded text-[10px] ${activeExam.mode === 'exam' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}`;
      document.getElementById('testMetaProgress').innerText = `${activeExam.currentIndex + 1} / ${activeExam.questions.length}`;
      document.getElementById('testQEn').innerText = `Q${activeExam.currentIndex + 1}. ${q.question}`;
      document.getElementById('testQOr').innerText = q.questionOdia || '';

      const container = document.getElementById('testOptionsBox');
      container.innerHTML = '';
      const userPick = activeExam.answers[q.id];

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        let btnClasses = "w-full p-3 rounded-xl border text-left font-medium text-xs flex items-center justify-between transition ";

        if (activeExam.mode === 'exam') {
          btnClasses += userPick === key ? "border-indigo-600 bg-indigo-600 text-white font-bold" : "border-slate-200 bg-slate-50";
        } else {
          if (activeExam.practiceRevealed[q.id]) {
            if (key === q.correctAnswer) {
              btnClasses += "border-emerald-600 bg-emerald-50 text-emerald-900 font-bold";
            } else if (userPick === key) {
              btnClasses += "border-rose-600 bg-rose-50 text-rose-900 font-bold";
            } else {
              btnClasses += "border-slate-200 bg-slate-50 opacity-60";
            }
          } else {
            btnClasses += "border-slate-200 bg-slate-50";
          }
        }

        btn.className = btnClasses;
        btn.innerHTML = `<span class="font-bold mr-2">${key}.</span> <span>${val}</span>`;
        btn.onclick = () => selectOption(q.id, key);
        container.appendChild(btn);
      });

      const practiceBox = document.getElementById('testPracticeBox');
      if (activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id]) {
        practiceBox.classList.remove('hidden');
        practiceBox.className = userPick === q.correctAnswer ? 'p-3 rounded-xl text-xs border border-emerald-200 bg-emerald-50 text-emerald-900' : 'p-3 rounded-xl text-xs border border-rose-200 bg-rose-50 text-rose-900';
        practiceBox.innerHTML = `<p class="whitespace-pre-line leading-relaxed"><strong>Explanation:</strong> ${q.explanation || 'Direct factual answer.'}</p>`;
      } else {
        practiceBox.classList.add('hidden');
      }

      document.getElementById('testPrevBtn').disabled = isFirst;
      if (isLast) {
        document.getElementById('testNextBtn').classList.add('hidden');
        document.getElementById('testSubmitBtn').classList.remove('hidden');
      } else {
        document.getElementById('testNextBtn').classList.remove('hidden');
        document.getElementById('testSubmitBtn').classList.add('hidden');
      }
    }

    function selectOption(qId, key) {
      activeExam.answers[qId] = key;
      if (activeExam.mode === 'practice') activeExam.practiceRevealed[qId] = true;
      renderQuestion();
    }

    function navigateQuestion(offset) {
      activeExam.currentIndex += offset;
      renderQuestion();
    }

    function confirmSubmitTest() {
      confirmDialog('Submit Test', 'Submit your assessment?', finishTest);
    }

    function finishTest() {
      clearInterval(activeExam.timerInterval);
      document.getElementById('navTimerBadge').classList.add('hidden');

      let obtainedMarks = 0;
      activeExam.questions.forEach(q => {
        if (activeExam.answers[q.id] === q.correctAnswer) obtainedMarks++;
      });

      const totalMarks = activeExam.questions.length;
      const percentage = Math.round((obtainedMarks / totalMarks) * 100) || 0;

      router.navigate('result-screen', { resultData: { obtainedMarks, totalMarks, percentage } });
    }

    // Initialize App & Realtime Cloud Data
    window.addEventListener('DOMContentLoaded', () => {
      initRealtimeSync();
      router.navigate('home');
    });
  </script>
