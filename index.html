  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyClZPVVbeaz43l-SRYSRE0O504Lc4vEMLE",
      authDomain: "satyapeeth-d1fe1.firebaseapp.com",
      projectId: "satyapeeth-d1fe1",
      storageBucket: "satyapeeth-d1fe1.firebasestorage.app",
      messagingSenderId: "393666660094",
      appId: "1:393666660094:web:6484724ab9035b38bd47af",
      measurementId: "G-Y9WN2HDHRK"
    };

    firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();
    const ADMIN_PHONE = "919556576071";

    const DB_KEYS = {
      AUTH_STUDENT: 'sp_auth_student_master',
      AUTH_ADMIN: 'sp_auth_admin_master',
      AUTH_PARENT: 'sp_auth_parent_master',
      THEME: 'sp_theme_pref'

    function initTheme() {
      const savedTheme = localStorage.getItem(DB_KEYS.THEME) || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-400 text-xs sm:text-sm';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-moon text-amber-400 text-xs sm:text-sm';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(DB_KEYS.THEME, isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-amber-400 text-xs sm:text-sm' : 'fa-solid fa-moon text-amber-400 text-xs sm:text-sm';
    }

    let cloudState = {
      classes: JSON.parse(localStorage.getItem('sp_c_classes')) || ["10", "9", "8", "7", "6"],
      students: JSON.parse(localStorage.getItem('sp_c_students')) || [],
      admissions: JSON.parse(localStorage.getItem('sp_c_admissions')) || [],
      registrations: JSON.parse(localStorage.getItem('sp_c_registrations')) || [],
      results: JSON.parse(localStorage.getItem('sp_c_results')) || [],
      subjects: JSON.parse(localStorage.getItem('sp_c_subjects')) || [
        { id: "sub_10_soc", class: "10", name: "Social Science (ଇତିହାସ ଓ ଭୂଗୋଳ)" },
        { id: "sub_10_fl_odia", class: "10", name: "First Language Odia (ସାହିତ୍ୟ ସିନ୍ଧୁ)" },
        { id: "sub_10_ps", class: "10", name: "Physical Science (ଭୌତିକ ବିଜ୍ଞାନ)" },
        { id: "sub_10_ls", class: "10", name: "Life Science (ଜୀବ ବିଜ୍ଞାନ)" },
        { id: "sub_10_mth", class: "10", name: "Mathematics (ଜ୍ୟାମିତି ଓ ବୀଜଗଣିତ)" },
        { id: "sub_10_eng", class: "10", name: "English" }
      ],
      topics: JSON.parse(localStorage.getItem('sp_c_topics')) || [
        { id: "top_10_soc_1", class: "10", subjectId: "sub_10_soc", name: "ଭାରତରେ ଆଇନ ଅମାନ୍ୟ ଆନ୍ଦୋଳନ ଓ ଓଡ଼ିଶାରେ ଏହାର ପ୍ରଭାବ" },
        { id: "top_10_soc_2", class: "10", subjectId: "sub_10_soc", name: "ଭାରତ (ଆକାର ଓ ଅବସ୍ଥିତି)" }
      ],
      questions: JSON.parse(localStorage.getItem('sp_c_questions')) || [],
      notes: JSON.parse(localStorage.getItem('sp_c_notes')) || [],
      videos: JSON.parse(localStorage.getItem('sp_c_videos')) || [],
      adminSettings: { password: "Kalyani@123" }
    };

    function initRealtimeSync() {
      firestore.collection("settings").doc("security").onSnapshot(doc => {
        if (doc.exists && doc.data().password) cloudState.adminSettings.password = doc.data().password;
      }, () => {});

      firestore.collection("settings").doc("classes").onSnapshot(doc => {
        if (doc.exists && doc.data().list) {
          cloudState.classes = doc.data().list;
          localStorage.setItem('sp_c_classes', JSON.stringify(cloudState.classes));
        }
      }, () => {});

      firestore.collection("students").onSnapshot(snapshot => {
        cloudState.students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('sp_c_students', JSON.stringify(cloudState.students));
        updateDashboardCounts();
      }, () => {});

      firestore.collection("admissions").onSnapshot(snapshot => {
        cloudState.admissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('sp_c_admissions', JSON.stringify(cloudState.admissions));
        updateDashboardCounts();
      }, () => {});

      firestore.collection("registrations").onSnapshot(snapshot => {
        cloudState.registrations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('sp_c_registrations', JSON.stringify(cloudState.registrations));
        updateDashboardCounts();
      }, () => {});

      firestore.collection("results").onSnapshot(snapshot => {
        cloudState.results = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('sp_c_results', JSON.stringify(cloudState.results));
        updateDashboardCounts();
      }, () => {});

      firestore.collection("subjects").onSnapshot(snapshot => {
        if (!snapshot.empty) {
          cloudState.subjects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          localStorage.setItem('sp_c_subjects', JSON.stringify(cloudState.subjects));
        }
      }, () => {});

      firestore.collection("topics").onSnapshot(snapshot => {
        if (!snapshot.empty) {
          cloudState.topics = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          localStorage.setItem('sp_c_topics', JSON.stringify(cloudState.topics));
        }
      }, () => {});

      firestore.collection("questions").onSnapshot(snapshot => {
        cloudState.questions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('sp_c_questions', JSON.stringify(cloudState.questions));
        updateDashboardCounts();
      }, () => {});

      firestore.collection("notes").onSnapshot(snapshot => {
        cloudState.notes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('sp_c_notes', JSON.stringify(cloudState.notes));
        updateDashboardCounts();
      }, () => {});

      firestore.collection("videos").onSnapshot(snapshot => {
        cloudState.videos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('sp_c_videos', JSON.stringify(cloudState.videos));
        updateDashboardCounts();
      }, () => {});
    }

    function updateDashboardCounts() {
      if (router.currentRoute.startsWith('admin-dashboard')) {
        const activeTab = router.currentRouteParamTab || 'html-upload';
        const tabContentEl = document.getElementById('adminTabContent');
        if (tabContentEl && views.adminTabs[activeTab]) {
          tabContentEl.innerHTML = views.adminTabs[activeTab]({
            admissions: cloudState.admissions,
            registrations: cloudState.registrations,
            students: cloudState.students,
            questions: cloudState.questions,
            notes: cloudState.notes,
            videos: cloudState.videos,
            results: cloudState.results
          });
        }
      }
    }

    function toast(title, msg, type = 'info') {
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-indigo-600 text-white'
      };
      const toastEl = document.createElement('div');
      toastEl.className = `${colors[type]} p-3 rounded-xl shadow-xl flex items-start gap-2.5 pointer-events-auto transition max-w-sm border border-white/20 text-xs`;
      toastEl.innerHTML = `<div><h4 class="font-bold">${title}</h4><p class="opacity-90 mt-0.5">${msg}</p></div>`;
      document.getElementById('toastContainer').appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toastEl.remove(), 250);
      }, 3500);
    }

    function confirmDialog(title, msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMsg').innerText = msg;
      modal.classList.remove('hidden');

      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

    function sendWhatsAppNotification(type, payload) {
      let text = "";
      if (type === 'registration') {
        text = `🔔 *New Mock Registration (Satyapeeth)*%0A%0A👤 *Student:* ${payload.name}%0A👨‍👩‍👦 *Parent:* ${payload.parentName}%0A📚 *Class:* ${payload.class}%0A📱 *Parent Phone:* ${payload.phone}%0A📧 *Email:* ${payload.email}`;
      } else if (type === 'admission') {
        text = `🌟 *New Full Admission Application (Satyapeeth)*%0A%0A👤 *Student:* ${payload.name}%0A👨‍👩‍👦 *Parent/Guardian:* ${payload.guardian}%0A📚 *Class:* ${payload.class}%0A📱 *Parent Phone:* ${payload.phone}%0A🏫 *School:* ${payload.school}`;
      }
      const url = `https://api.whatsapp.com/send?phone=${ADMIN_PHONE}&text=${text}`;
      window.open(url, '_blank');
    }

    function shareSatyapeethApp() {
      const shareData = {
        title: 'Satyapeeth — BSE Odisha Learning App',
        text: 'Best online CBT Mock Tests, Video Classes, and PDF Notes for BSE Odisha students.',
        url: window.location.origin
      };
      if (navigator.share) {
        navigator.share(shareData);
      } else {
        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent('Join Satyapeeth for Class 6-10 BSE Odisha Online Mock Tests, PDF Notes & Certificates: ' + window.location.origin)}`;
        window.open(waUrl, '_blank');
      }
    }

    const auth = {
      getStudent: () => {
        try { return JSON.parse(localStorage.getItem(DB_KEYS.AUTH_STUDENT)); } catch (e) { return null; }
      },
      getAdmin: () => {
        try { return JSON.parse(localStorage.getItem(DB_KEYS.AUTH_ADMIN)); } catch (e) { return null; }
      },
      getParent: () => {
        try { return JSON.parse(localStorage.getItem(DB_KEYS.AUTH_PARENT)); } catch (e) { return null; }
      },
      isGuest: () => localStorage.getItem('sp_guest_flag') === 'true',
      setStudent: (data) => {
        localStorage.removeItem('sp_guest_flag');
        localStorage.setItem(DB_KEYS.AUTH_STUDENT, JSON.stringify(data));
      },
      setAdmin: (data) => localStorage.setItem(DB_KEYS.AUTH_ADMIN, JSON.stringify(data)),
      setParent: (data) => localStorage.setItem(DB_KEYS.AUTH_PARENT, JSON.stringify(data)),
      logout: () => {
        confirmDialog('Log Out', 'Are you sure you want to log out from Satyapeeth?', () => {
          localStorage.removeItem(DB_KEYS.AUTH_STUDENT);
          localStorage.removeItem(DB_KEYS.AUTH_ADMIN);
          localStorage.removeItem(DB_KEYS.AUTH_PARENT);
          localStorage.removeItem('sp_guest_flag');
          router.updateHeader();
          toast('Logged Out', 'Session closed successfully.', 'info');
          router.navigate('home');
        });
      }
    };

      mode: 'exam',
      subject: null,
      topic: null,
      questions: [],
      currentIndex: 0,
      answers: {},
      practiceRevealed: {},
      timerInterval: null,
      timeLeft: 600

        const parent = auth.getParent();

          document.getElementById('navUserName').innerText = student.name;
          const badge = document.getElementById('navUserType');
          if (isGuest) {
            badge.className = "bg-amber-400 text-indigo-950 px-1.5 py-0.5 rounded text-[9px] font-extrabold";

        if (viewName.startsWith('admin-dashboard') && !auth.getAdmin()) {

        if (['student-dashboard', 'subject-select', 'topic-select', 'mode-select', 'test-screen', 'result-screen', 'notes-hub', 'notes-view', 'video-view'].includes(viewName) && !auth.getStudent()) {

    function handleHtmlImport(e) {
      e.preventDefault();
      const cls = document.getElementById('impClassSelect').value;
      const subId = document.getElementById('impSubjectSelect').value;
      const topId = document.getElementById('impTopicSelect').value;
      const rawInput = document.getElementById('impHtmlCode').value.trim();

      if (!subId || !topId) return alert("Select Subject & Chapter first!");

      let extractedQuestions = [];

      const jsMatch = rawInput.match(/questionsData\s*=\s*(\[[\s\S]*?\]);/);
      if (jsMatch && jsMatch[1]) {
        try {
          const rawParsed = Function('"use strict";return (' + jsMatch[1] + ')')();
          rawParsed.forEach(q => {
            extractedQuestions.push({
              class: cls,
              subjectId: subId,
              topicId: topId,
              question: (q.qEn && q.qEn !== q.qOr) ? q.qEn : "",
              questionOdia: q.qOr || q.qEn || q.question || "",
              options: q.options || { A: "", B: "", C: "", D: "" },
              correctAnswer: q.ans || q.correctAnswer || "A",
              explanation: q.expOr || q.expEn || q.explanation || "",
              marks: 1
            });
          });
        } catch (err) {
          console.log("JSON Parse Error:", err);
        }
      }

      if (extractedQuestions.length === 0) {
        const blocks = rawInput.split(/\n\s*\n/);
        blocks.forEach(block => {
          const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length >= 5) {
            let qOdia = "", qEng = "", optA = "", optB = "", optC = "", optD = "", ans = "A", exp = "";

            lines.forEach(line => {
              if (line.match(/^Q(uestion|\d+)?[:.]?\s*/i)) {
                if (!qOdia) qOdia = line.replace(/^Q(uestion|\d+)?[:.]?\s*/i, '');
                else qEng = line.replace(/^Q(uestion|\d+)?[:.]?\s*/i, '');
              } else if (line.match(/^[A|କ][:.)\-]\s*/i)) {
                optA = line.replace(/^[A|କ][:.)\-]\s*/i, '');
              } else if (line.match(/^[B|ଖ][:.)\-]\s*/i)) {
                optB = line.replace(/^[B|ଖ][:.)\-]\s*/i, '');
              } else if (line.match(/^[C|ଗ][:.)\-]\s*/i)) {
                optC = line.replace(/^[C|ଗ][:.)\-]\s*/i, '');
              } else if (line.match(/^[D|ଘ][:.)\-]\s*/i)) {
                optD = line.replace(/^[D|ଘ][:.)\-]\s*/i, '');
              } else if (line.match(/^(Ans|Answer|ଉତ୍ତର)[:.]?\s*/i)) {
                let val = line.replace(/^(Ans|Answer|ଉତ୍ତର)[:.]?\s*/i, '').toUpperCase();
                if (val.includes('B') || val.includes('ଖ')) ans = 'B';
                else if (val.includes('C') || val.includes('ଗ')) ans = 'C';
                else if (val.includes('D') || val.includes('ଘ')) ans = 'D';
                else ans = 'A';
              } else if (line.match(/^(Exp|Explanation|ବ୍ୟାଖ୍ୟା)[:.]?\s*/i)) {
                exp = line.replace(/^(Exp|Explanation|ବ୍ୟାଖ୍ୟା)[:.]?\s*/i, '');
              }
            });

            if (optA && optB) {
              extractedQuestions.push({
                class: cls,
                subjectId: subId,
                topicId: topId,
                question: qEng,
                questionOdia: qOdia || lines[0],
                options: { A: optA, B: optB, C: optC || "", D: optD || "" },
                correctAnswer: ans,
                explanation: exp,
                marks: 1
              });
            }
          }
        });
      }

      if (extractedQuestions.length === 0) return alert("Could not parse questions! Please check code format.");

      const batch = firestore.batch();
      extractedQuestions.forEach(q => {
        const docRef = firestore.collection("questions").doc();
        batch.set(docRef, q);
      });

      batch.commit().then(() => {
        toast("Success!", `Loaded ${extractedQuestions.length} questions into Cloud DB.`, "success");
        router.navigate('admin-dashboard', { tab: 'questions' });
      });
    }

      const record = type === 'adm' 
        ? cloudState.admissions.find(a => a.id === docId)
        : cloudState.registrations.find(r => r.id === docId);

      const studentId = "SP" + record.class + "-" + Math.floor(1000 + Math.random() * 9000);
      const password = "PASS" + Math.floor(1000 + Math.random() * 9000);

      firestore.collection(collection).doc(docId).update({
        status: "Approved",
        assignedStudentId: studentId
      });

      firestore.collection("students").add({
        studentId,
        name: record.name,
        guardian: record.guardian || record.parentName || "Parent",
        class: record.class,
        phone: record.phone,
        email: record.email,
        password: password,
        type: type === 'adm' ? "Admission" : "Registration",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        toast('Approved!', `Student ID: ${studentId} & Password: ${password}`, 'success');
      });
    }

    function deleteStudent(docId) {
      confirmDialog('Delete Student', 'Remove this profile from cloud?', () => {
        firestore.collection("students").doc(docId).delete().then(() => toast('Deleted', 'Student removed.', 'info'));
      });
    }

    function startMonthlyMegaTest(targetClass) {
      const classQuestions = cloudState.questions.filter(q => String(q.class) === String(targetClass));
      if (classQuestions.length === 0) {
        return alert("No questions uploaded yet for Monthly Mega Mock Test!");
      }

      activeExam = {
        mode: 'exam',
        subject: { name: `Class ${targetClass} Monthly CBT Exam` },
        topic: { name: "Full Syllabus Grand Assessment" },
        questions: classQuestions.slice(0, 50),
        currentIndex: 0,
        answers: {},
        practiceRevealed: {},
        timeLeft: 1800
      };

      const navTimer = document.getElementById('navTimerBadge');
      navTimer.classList.remove('hidden');
      startTimer();
      router.navigate('test-screen');
    }

    function startTestEngine(subjectId, topicId, mode) {
      const subject = cloudState.subjects.find(s => s.id === subjectId);
      const topic = cloudState.topics.find(t => t.id === topicId);
      let questions = cloudState.questions.filter(q => q.topicId === topicId);

      if (questions.length === 0) {
        questions = [
          {
            id: "q_demo_1",
            question: "",
            questionOdia: "୧୯୨୯ ଲାହୋର କଂଗ୍ରେସ ଅଧିବେଶନରେ କିଏ ଅଧ୍ୟକ୍ଷତା କରିଥିଲେ?",
            options: { A: "ମହାତ୍ମା ଗାନ୍ଧୀ", B: "ଜବାହରଲାଲ୍ ନେହେରୁ", C: "ସୁଭାଷ ବୋଷ", D: "ଗୋପବନ୍ଧୁ ଦାସ" },
            correctAnswer: "B",
            explanation: "ଲାହୋର ଅଧିବେଶନରେ ଯୁବନେତା ଜବାହରଲାଲ୍ ନେହେରୁ ସଭାପତିତ୍ୱ କରିଥିଲେ।"
          }
        ];
      }

      activeExam = {
        mode,
        subject,
        topic,
        questions,
        currentIndex: 0,
        answers: {},
        practiceRevealed: {},
        timeLeft: 600
      };

      const navTimer = document.getElementById('navTimerBadge');
      if (mode === 'exam') {
        navTimer.classList.remove('hidden');
        startTimer();
      } else {
        navTimer.classList.add('hidden');
      }
      router.navigate('test-screen');
    }

    function startTimer() {
      clearInterval(activeExam.timerInterval);
      activeExam.timerInterval = setInterval(() => {
        activeExam.timeLeft--;
        const m = Math.floor(activeExam.timeLeft / 60);
        const s = activeExam.timeLeft % 60;
        const navTimerVal = document.getElementById('navTimerVal');
        if (navTimerVal) navTimerVal.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        if (activeExam.timeLeft <= 0) {
          clearInterval(activeExam.timerInterval);
          finishTest();
        }
      }, 1000);
    }

    function renderQuestion() {
      const q = activeExam.questions[activeExam.currentIndex];
      const isLast = activeExam.currentIndex === activeExam.questions.length - 1;
      const isFirst = activeExam.currentIndex === 0;

      document.getElementById('testMetaMode').innerText = activeExam.mode === 'exam' ? 'CBT Exam' : 'Practice';
      document.getElementById('testMetaMode').className = `font-bold uppercase px-2.5 py-1 rounded text-xs ${activeExam.mode === 'exam' ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'}`;
      document.getElementById('testMetaProgress').innerText = `${activeExam.currentIndex + 1} / ${activeExam.questions.length}`;

      const qOrBox = document.getElementById('testQOr');
      const qEnBox = document.getElementById('testQEn');

      const mainText = q.questionOdia || q.question;
      qOrBox.innerText = `Q${activeExam.currentIndex + 1}. ${mainText}`;

      if (q.question && q.questionOdia && q.question.trim() !== q.questionOdia.trim()) {
        qEnBox.innerText = q.question;
        qEnBox.classList.remove('hidden');
      } else {
        qEnBox.innerText = '';
        qEnBox.classList.add('hidden');
      }

      const container = document.getElementById('testOptionsBox');
      container.innerHTML = '';
      const userPick = activeExam.answers[q.id || activeExam.currentIndex];

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        let btnClasses = "w-full p-3.5 rounded-2xl border text-left font-medium text-xs sm:text-sm flex items-center justify-between transition leading-relaxed ";

        if (activeExam.mode === 'exam') {
          btnClasses += userPick === key 
            ? "border-indigo-600 bg-indigo-600 text-white font-bold shadow" 
            : "border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 hover:border-indigo-400";
        } else {
          if (activeExam.practiceRevealed[q.id || activeExam.currentIndex]) {
            if (key === q.correctAnswer) {
              btnClasses += "border-emerald-600 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-300 font-bold";
            } else if (userPick === key) {
              btnClasses += "border-rose-600 bg-rose-50 dark:bg-rose-950/60 text-rose-900 dark:text-rose-300 font-bold";
            } else {
              btnClasses += "border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 opacity-50 text-slate-700 dark:text-slate-300";
            }
          } else {
            btnClasses += "border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200";
          }
        }

        btn.className = btnClasses;
        btn.innerHTML = `<span class="font-bold mr-2.5 text-sm">${key}.</span> <span class="flex-1">${val}</span>`;
        btn.onclick = () => selectOption(q.id || activeExam.currentIndex, key);
        container.appendChild(btn);
      });

      const practiceBox = document.getElementById('testPracticeBox');
      if (activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id || activeExam.currentIndex]) {
        practiceBox.classList.remove('hidden');
        practiceBox.className = userPick === q.correctAnswer 
          ? 'p-4 rounded-2xl text-xs sm:text-sm border border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-200' 
          : 'p-4 rounded-2xl text-xs sm:text-sm border border-rose-200 dark:border-rose-800 bg-rose-50 dark:bg-rose-950/60 text-rose-900 dark:text-rose-200';
        practiceBox.innerHTML = `<p class="whitespace-pre-line leading-relaxed"><strong>Explanation:</strong> ${q.explanation || 'Direct factual question.'}</p>`;
      } else {
        practiceBox.classList.add('hidden');
      }

      document.getElementById('testPrevBtn').disabled = isFirst;
      if (isLast) {
        document.getElementById('testNextBtn').classList.add('hidden');
        document.getElementById('testSubmitBtn').classList.remove('hidden');
      } else {
        document.getElementById('testNextBtn').classList.remove('hidden');
        document.getElementById('testSubmitBtn').classList.add('hidden');
      }
    }

    function selectOption(qId, key) {
      activeExam.answers[qId] = key;
      if (activeExam.mode === 'practice') activeExam.practiceRevealed[qId] = true;
      renderQuestion();
    }

    function navigateQuestion(offset) {
      activeExam.currentIndex += offset;
      renderQuestion();
    }

    function confirmSubmitTest() {
      confirmDialog('Submit Test', 'Submit your assessment and view marksheet?', finishTest);
    }

    function finishTest() {
      clearInterval(activeExam.timerInterval);
      document.getElementById('navTimerBadge').classList.add('hidden');

      let obtainedMarks = 0;
      activeExam.questions.forEach((q, idx) => {
        if (activeExam.answers[q.id || idx] === q.correctAnswer) obtainedMarks++;
      });

      const totalMarks = activeExam.questions.length;
      const percentage = Math.round((obtainedMarks / totalMarks) * 100) || 0;
      const student = auth.getStudent() || { name: "Guest Student", class: "10", phone: "9876543210", email: "guest@satyapeeth.in", guardian: "Guest Parent" };

      const resultPayload = {
        studentName: student.name,
        studentClass: student.class,
        studentPhone: student.phone || '',
        parentPhone: student.phone || '',
        parentName: student.guardian || student.parentName || 'Parent',
        studentEmail: student.email || '',
        subjectName: activeExam.subject ? activeExam.subject.name : 'All Subjects',
        topicName: activeExam.topic ? activeExam.topic.name : 'Chapter Test',
        obtainedMarks,
        totalMarks,
        percentage,
        certificateId: "SP-CERT-" + Date.now().toString().slice(-6),
        date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };

      firestore.collection("results").add(resultPayload).then(docRef => {
        router.navigate('result-screen', { resultData: { id: docRef.id, ...resultPayload } });
      });
    }

    function openCertificateModal(resultId) {
      const res = cloudState.results.find(r => r.id === resultId);
      if (!res) return;

      const certHtml = `
        <div id="certModalBackdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 overflow-y-auto">
          <div class="max-w-2xl w-full bg-[#fdfbf7] text-slate-900 rounded-3xl p-6 sm:p-8 shadow-2xl sambalpuri-border relative space-y-5" id="printableCertificate">
            
            <div class="border-2 border-dashed border-amber-800/40 p-5 rounded-2xl relative space-y-4 bg-white/90">
              <div class="flex justify-between items-center border-b border-amber-900/20 pb-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-950 text-amber-400 flex items-center justify-center font-cinzel font-black text-base shadow">
                  SP
                </div>
                <div class="text-center">
                  <h2 class="font-cinzel text-xl sm:text-2xl font-black tracking-widest text-indigo-950">SATYAPEETH</h2>
                  <p class="text-[10px] uppercase font-extrabold tracking-widest text-amber-800">Certificate of Academic Excellence</p>
                </div>
                <i class="fa-solid fa-award text-3xl text-amber-600"></i>
              </div>

              <div class="text-center space-y-2 py-3">
                <p class="text-xs italic text-slate-600 font-serif">This prestigious credential is proudly conferred upon</p>
                <h3 class="text-2xl sm:text-3xl font-black text-indigo-950 border-b-2 border-amber-600 pb-1 inline-block uppercase tracking-wider">
                  ${res.studentName}
                </h3>
                <p class="text-xs sm:text-sm text-slate-700 leading-relaxed max-w-md mx-auto pt-1 font-medium">
                  For achieving outstanding academic performance of <strong class="text-rose-700 font-bold">${res.percentage}%</strong> in <strong class="text-indigo-950 font-bold">${res.topicName}</strong> (Class ${res.studentClass || '10'}).
                </p>
              </div>

              <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-700 border-t border-amber-900/20 pt-3 bg-amber-50/50 p-2.5 rounded-xl">
                <p><strong>Parent / Guardian:</strong> ${res.parentName || 'Parent'}</p>
                <p><strong>Student Email:</strong> ${res.studentEmail || 'Registered'}</p>
                <p><strong>Award Date:</strong> ${res.date}</p>
                <p><strong>Certificate ID:</strong> <span class="font-mono text-indigo-950 font-bold">${res.certificateId}</span></p>
              </div>

              <div class="flex justify-between items-end pt-4">
                <div class="text-left text-[9px] text-slate-500">
                  <p>BSE Odisha State Board Curriculum</p>
                  <p>Verified Academic Award</p>
                </div>
                <div class="text-right">
                  <div class="font-signature italic font-bold text-sm text-indigo-950 border-b border-slate-500 pb-0.5 px-3">Satyajeet Sahu</div>
                  <p class="text-[9px] uppercase tracking-wider font-bold text-slate-600 mt-0.5">Authorized Signature</p>
                </div>
              </div>
            </div>

            <div class="flex gap-2 print:hidden">
              <button onclick="window.print()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black rounded-xl text-xs transition shadow flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-print"></i> Print / Save PDF
              </button>
              <button onclick="document.getElementById('certModalBackdrop').remove()" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl text-xs transition">
                Close
              </button>
            </div>

          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', certHtml);
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function triggerPWAInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            toast('App Installed!', 'Satyapeeth added to your phone screen.', 'success');
          }
          deferredPrompt = null;
        });
      } else {
        toast('Install App', 'Tap browser 3-dots (⋮) and click "Add to Home screen" or "Install App".', 'info');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initRealtimeSync();

      if (auth.getStudent()) {
        router.navigate('student-dashboard');
      } else if (auth.getAdmin()) {
        router.navigate('admin-dashboard');
      } else if (auth.getParent()) {
        router.navigate('parent-portal');
      } else {
        router.navigate('home');
      }
    });
  </script>
</body>
</html>
