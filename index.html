<!DOCTYPE html>
<html lang="or" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SATYAPEETH — Odisha Board Online CBT & Learning Portal</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter & Noto Sans Oriya for Odia Unicode rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Oriya:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans Oriya', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased custom-scrollbar">

  <!-- Toast Notification System -->
  <div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Global Header -->
  <header class="bg-indigo-950 text-white sticky top-0 z-40 border-b border-indigo-900 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-indigo-950 font-black text-xl shadow-inner">
          SP
        </div>
        <div>
          <span class="text-xl font-black tracking-wider text-amber-400">SATYAPEETH</span>
          <span class="hidden sm:inline-block text-[10px] text-indigo-200 uppercase tracking-widest font-semibold ml-2 border-l border-indigo-700 pl-2">Odisha Board Prep</span>
        </div>
      </div>

      <!-- Navigation Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Live Exam Timer Badge -->
        <div id="navTimerBadge" class="hidden flex items-center gap-2 bg-rose-950/80 border border-rose-500 text-rose-300 px-3 py-1.5 rounded-lg text-xs font-mono font-bold tracking-widest animate-pulse">
          <i class="fa-solid fa-stopwatch"></i>
          <span id="navTimerVal">00:00</span>
        </div>

        <!-- Dynamic User Status -->
        <div id="navUserBadge" class="hidden flex items-center gap-2 bg-indigo-900 border border-indigo-700 px-3 py-1.5 rounded-lg text-xs font-medium">
          <i class="fa-solid fa-user-graduate text-amber-400"></i>
          <span id="navUserName" class="font-bold text-white"></span>
          <span id="navUserType" class="px-1.5 py-0.5 rounded text-[10px] font-bold"></span>
        </div>

        <!-- Student Action Buttons -->
        <button id="navLoginBtn" onclick="router.navigate('login')" class="text-xs bg-indigo-800 hover:bg-indigo-700 border border-indigo-600 px-3.5 py-2 rounded-lg font-bold text-white transition">
          <i class="fa-solid fa-right-to-bracket mr-1"></i> Login
        </button>
        <button id="navRegBtn" onclick="router.navigate('register-free')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg font-bold transition shadow-sm">
          Register
        </button>
        <button id="navAdmBtn" onclick="router.navigate('admission')" class="text-xs bg-amber-500 hover:bg-amber-400 text-indigo-950 px-3.5 py-2 rounded-lg font-extrabold transition shadow-sm">
          Admission
        </button>
        <button id="navLogoutBtn" onclick="auth.logout()" class="hidden text-xs bg-slate-800 hover:bg-rose-900 border border-slate-700 text-slate-300 hover:text-white px-3 py-2 rounded-lg font-bold transition">
          <i class="fa-solid fa-power-off"></i>
        </button>

        <!-- Admin Portal Trigger -->
        <button id="navAdminBtn" onclick="router.navigate('admin-auth')" class="text-xs bg-indigo-900/50 hover:bg-indigo-900 border border-indigo-800 text-indigo-300 hover:text-white px-2.5 py-2 rounded-lg transition" title="Admin Portal">
          <i class="fa-solid fa-shield-halved"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8"></main>

  <!-- Confirmation Modal Dialog -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-2xl border border-slate-100 overflow-hidden transform transition-all p-6 text-center">
      <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-4 text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 id="confirmTitle" class="text-lg font-bold text-slate-900 mb-2">Confirm Action</h3>
      <p id="confirmMsg" class="text-sm text-slate-600 mb-6">Are you sure you want to proceed?</p>
      <div class="flex gap-3">
        <button id="confirmCancelBtn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition">Cancel</button>
        <button id="confirmOkBtn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Global Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-xs text-center">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <p>&copy; 2026 <strong>SATYAPEETH</strong> — State Level Odisha Board Assessment Network</p>
      <div class="flex gap-6">
        <span>BSE Odisha Curriculum</span>
        <span>Class 6 to 10 Special</span>
      </div>
    </div>
  </footer>

  <!-- Core JavaScript Engine -->
  <script>
    const DB_KEYS = {
      STUDENTS: 'sp_students',
      ADMISSIONS: 'sp_admissions',
      REGISTRATIONS: 'sp_registrations',
      SUBJECTS: 'sp_subjects',
      TOPICS: 'sp_topics',
      NOTES: 'sp_notes',
      QUESTIONS: 'sp_questions',
      RESULTS: 'sp_results',
      AUTH_STUDENT: 'sp_session_student',
      AUTH_ADMIN: 'sp_session_admin'
    };

    const SEED_DATA = {
      subjects: [
        { id: "sub_10_fl_odia", class: "10", name: "First Language Odia (ସାହିତ୍ୟ ସିନ୍ଧୁ)" },
        { id: "sub_10_ps", class: "10", name: "Physical Science (ଭୌତିକ ବିଜ୍ଞାନ)" },
        { id: "sub_10_ls", class: "10", name: "Life Science (ଜୀବ ବିଜ୍ଞାନ)" },
        { id: "sub_10_mth", class: "10", name: "Mathematics (ଜ୍ୟାମିତି ଓ ବୀଜଗଣିତ)" },
        { id: "sub_10_soc", class: "10", name: "Social Science (ଇତିହାସ ଓ ଭୂଗୋଳ)" },
        { id: "sub_10_eng", class: "10", name: "English" },

        { id: "sub_9_sci", class: "9", name: "Science (ବିଜ୍ଞାନ)" },
        { id: "sub_9_mth", class: "9", name: "Mathematics (ଗଣିତ)" },
        { id: "sub_9_odia", class: "9", name: "Odia (ସାହିତ୍ୟ ଧାରା)" },

        { id: "sub_8_sci", class: "8", name: "Science (ବିଜ୍ଞାନ)" },
        { id: "sub_8_mth", class: "8", name: "Mathematics (ଗଣିତ)" },
        { id: "sub_7_sci", class: "7", name: "Science (ବିଜ୍ଞାନ)" },
        { id: "sub_6_sci", class: "6", name: "Science (ବିଜ୍ଞାନ)" }
      ],
      topics: [
        { id: "top_10_ps_1", class: "10", subjectId: "sub_10_ps", name: "ରାସାୟନିକ ପ୍ରତିକ୍ରିୟା ଓ ସମୀକରଣ (Chemical Reactions)", isDemo: true },
        { id: "top_10_ps_2", class: "10", subjectId: "sub_10_ps", name: "ଅମ୍ଳ, କ୍ଷାରକ ଓ ଲବଣ (Acids, Bases & Salts)", isDemo: false },
        { id: "top_10_ps_3", class: "10", subjectId: "sub_10_ps", name: "ଧାତୁ ଓ ଅଧାତୁ (Metals & Non-metals)", isDemo: false },
        { id: "top_10_ls_1", class: "10", subjectId: "sub_10_ls", name: "ପୋଷଣ (Nutrition)", isDemo: true },
        { id: "top_10_odia_1", class: "10", subjectId: "sub_10_fl_odia", name: "ବନ୍ଦେ ଉତ୍କଳ ଜନନୀ (Bande Utkala Janani)", isDemo: true },
        { id: "top_10_mth_1", class: "10", subjectId: "sub_10_mth", name: "ସରଳ ସହସମୀକରଣ (Linear Equations)", isDemo: true }
      ],
      notes: [
        {
          id: "note_1",
          class: "10",
          subjectId: "sub_10_ps",
          topicId: "top_10_ps_1",
          title: "ରାସାୟନିକ ପ୍ରତିକ୍ରିୟା ଓ ସମୀକରଣ ସମ୍ପୂର୍ଣ୍ଣ ନୋଟ୍ସ",
          content: "୧. ସଂଶ୍ଳେଷଣ ପ୍ରତିକ୍ରିୟା: ଯେଉଁ ରାସାୟନିକ ପ୍ରତିକ୍ରିୟାରେ ଦୁଇ ବା ତତୋऴିକ ପ୍ରତିକାରକ ମିଳିତ ହୋଇ ଏକମାତ୍ର ଉତ୍ପାଦ ସୃଷ୍ଟି କରନ୍ତି, ତାହାକୁ ସଂଶ୍ଳେଷଣ ପ୍ରତିକ୍ରିୟା କୁହାଯାଏ (e.g. 2H2 + O2 -> 2H2O)।\n\n୨. ବିଘଟନ ପ୍ରତିକ୍ରିୟା: ଗୋଟିଏ ମାତ୍ର ପ୍ରତିକାରକ ବିଘଟିତ ହୋଇ ଏକାଧିକ ସରଳ ଉତ୍ପାଦ ସୃଷ୍ଟି କରେ।"
        },
        {
          id: "note_2",
          class: "10",
          subjectId: "sub_10_ls",
          topicId: "top_10_ls_1",
          title: "ପୋଷଣ (Nutrition) Complete Revision Notes",
          content: "୧. ସ୍ୱଭୋଜୀ ପୋଷଣ (Autotrophic): ସବୁଜ ଉଦ୍ଭିଦ ଆଲୋକଶ୍ଳେଷଣ ଦ୍ୱାରା ନିଜ ଖାଦ୍ୟ ପ୍ରସ୍ତୁତ କରନ୍ତି।\n୨. ପରଭୋଜୀ ପୋଷଣ (Heterotrophic): ପ୍ରାଣୀମାନେ ଅନ୍ୟ ଉଦ୍ଭିଦ ବା ପ୍ରାଣୀଙ୍କ ଉପରେ ନିର୍ଭରଶୀଳ।"
        }
      ],
      questions: [
        {
          id: "q_1",
          class: "10",
          subjectId: "sub_10_ps",
          topicId: "top_10_ps_1",
          question: "Which of the following is a balanced combination reaction?",
          questionOdia: "ନିମ୍ନଲିଖିତ ମଧ୍ୟରୁ କେଉଁଟି ଏକ ସନ୍ତୁଳିତ ସଂଶ୍ଳେଷଣ ପ୍ରତିକ୍ରିୟା?",
          options: { A: "2H2 + O2 -> 2H2O", B: "CaCO3 -> CaO + CO2", C: "Zn + H2SO4 -> ZnSO4 + H2", D: "CH4 + 2O2 -> CO2 + 2H2O" },
          correctAnswer: "A",
          explanation: "Two elements combine to form a single compound in combination reaction (2H2 + O2 -> 2H2O).",
          marks: 1,
          difficulty: "Easy"
        },
        {
          id: "q_2",
          class: "10",
          subjectId: "sub_10_ps",
          topicId: "top_10_ps_2",
          question: "Which of the following compounds turns blue litmus paper into red?",
          questionOdia: "ନିମ୍ନଲିଖିତ ମଧ୍ୟରୁ କେଉଁ ଯୌଗିକ ନୀଳ ଲିଟମସ୍ କାଗଜକୁ ଲାଲ୍ କରେ?",
          options: { A: "NaOH Solution", B: "Lemon Juice (Citric Acid)", C: "Distilled Water", D: "Sodium Chloride Solution" },
          correctAnswer: "B",
          explanation: "Acids turn blue litmus red. Lemon juice contains Citric Acid.",
          marks: 1,
          difficulty: "Easy"
        },
        {
          id: "q_3",
          class: "10",
          subjectId: "sub_10_fl_odia",
          topicId: "top_10_odia_1",
          question: "Who is the creator/poet of Odisha's state anthem 'Bande Utkala Janani'?",
          questionOdia: "ଓଡ଼ିଶାର ରାଜ୍ୟ ସଙ୍ଗୀତ 'ବନ୍ଦେ ଉତ୍କଳ ଜନନୀ'ର ରଚୟିତା କିଏ?",
          options: { A: "Utkalmani Gopabandhu Das", B: "Kantakabi Laxmikanta Mohapatra", C: "Kabibara Radhanath Ray", D: "Bhaktakabi Madhusudan Rao" },
          correctAnswer: "B",
          explanation: "କାନ୍ତକବି ଲକ୍ଷ୍ମୀକାନ୍ତ ମହାପାତ୍ର ୧୯୧୨ ମସିହାରେ ବାଲେଶ୍ୱରଠାରେ ଅନୁଷ୍ଠିତ ଉତ୍କଳ ସମ୍ମିଳନୀ ପାଇଁ ଏହି କାଳଜୟୀ ଗୀତ ରଚନା କରିଥିଲେ।",
          marks: 1,
          difficulty: "Medium"
        },
        {
          id: "q_4",
          class: "10",
          subjectId: "sub_10_ls",
          topicId: "top_10_ls_1",
          question: "What is the primary site of photosynthesis in green plants?",
          questionOdia: "ସବୁଜ ଉଦ୍ଭିଦରେ ଆଲୋକଶ୍ଳେଷଣର ପ୍ରଧାନ ସ୍ଥାନ କେଉଁଟି?",
          options: { A: "Mitochondria", B: "Chloroplast (ହରିତକଣିକା)", C: "Ribosome", D: "Golgi bodies" },
          correctAnswer: "B",
          explanation: "Chloroplast contains chlorophyll which traps sunlight to synthesize carbohydrates.",
          marks: 1,
          difficulty: "Easy"
        }
      ]
    };

    const db = {
      get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
      set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
      init: () => {
        if (!localStorage.getItem(DB_KEYS.SUBJECTS)) db.set(DB_KEYS.SUBJECTS, SEED_DATA.subjects);
        if (!localStorage.getItem(DB_KEYS.TOPICS)) db.set(DB_KEYS.TOPICS, SEED_DATA.topics);
        if (!localStorage.getItem(DB_KEYS.QUESTIONS)) db.set(DB_KEYS.QUESTIONS, SEED_DATA.questions);
        if (!localStorage.getItem(DB_KEYS.NOTES)) db.set(DB_KEYS.NOTES, SEED_DATA.notes);
      }
    };
    db.init();

    function toast(title, msg, type = 'info') {
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-indigo-600 text-white'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      const toastEl = document.createElement('div');
      toastEl.className = `${colors[type]} p-4 rounded-xl shadow-xl flex items-start gap-3 pointer-events-auto transition transform translate-x-0 max-w-sm`;
      toastEl.innerHTML = `
        <i class="fa-solid ${icons[type]} text-lg mt-0.5"></i>
        <div>
          <h4 class="font-bold text-sm leading-tight">${title}</h4>
          <p class="text-xs opacity-90 mt-0.5 leading-normal">${msg}</p>
        </div>
      `;
      document.getElementById('toastContainer').appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toastEl.remove(), 300);
      }, 4000);
    }

    function confirmDialog(title, msg, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMsg').innerText = msg;
      modal.classList.remove('hidden');

      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

    const auth = {
      getStudent: () => JSON.parse(sessionStorage.getItem(DB_KEYS.AUTH_STUDENT)),
      getAdmin: () => JSON.parse(sessionStorage.getItem(DB_KEYS.AUTH_ADMIN)),
      isGuest: () => sessionStorage.getItem('sp_guest_mode') === 'true',
      setStudent: (data) => {
        sessionStorage.removeItem('sp_guest_mode');
        sessionStorage.setItem(DB_KEYS.AUTH_STUDENT, JSON.stringify(data));
      },
      setAdmin: (data) => sessionStorage.setItem(DB_KEYS.AUTH_ADMIN, JSON.stringify(data)),
      logout: () => {
        sessionStorage.removeItem(DB_KEYS.AUTH_STUDENT);
        sessionStorage.removeItem(DB_KEYS.AUTH_ADMIN);
        sessionStorage.removeItem('sp_guest_mode');
        router.updateHeader();
        toast('Logged Out', 'Session ended successfully.', 'info');
        router.navigate('home');
      }
    };

    let activeExam = {
      mode: 'exam',
      subject: null,
      topic: null,
      questions: [],
      currentIndex: 0,
      answers: {},
      practiceRevealed: {},
      timerInterval: null,
      timeLeft: 600,
      startTime: null
    };

    const router = {
      currentRoute: 'home',
      
      updateHeader: () => {
        const student = auth.getStudent();
        const admin = auth.getAdmin();
        const isGuest = auth.isGuest();
        const navUser = document.getElementById('navUserBadge');
        const loginBtn = document.getElementById('navLoginBtn');
        const regBtn = document.getElementById('navRegBtn');
        const admBtn = document.getElementById('navAdmBtn');
        const logoutBtn = document.getElementById('navLogoutBtn');

        if (student) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = student.name;
          const userTypeBadge = document.getElementById('navUserType');
          
          if (isGuest) {
            userTypeBadge.className = "bg-amber-400 text-indigo-950 px-1.5 py-0.5 rounded text-[10px] font-bold";
            userTypeBadge.innerText = "Guest Demo";
          } else if (student.type === 'Admission') {
            userTypeBadge.className = "bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[10px] font-black";
            userTypeBadge.innerText = `Class ${student.class} (All-Access)`;
          } else {
            userTypeBadge.className = "bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold";
            userTypeBadge.innerText = `Class ${student.class} (Mock Access)`;
          }

          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else if (admin) {
          navUser.classList.remove('hidden');
          document.getElementById('navUserName').innerText = "Satyajeet Dash";
          const userTypeBadge = document.getElementById('navUserType');
          userTypeBadge.className = "bg-rose-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold";
          userTypeBadge.innerText = "Master Admin";

          loginBtn.classList.add('hidden');
          regBtn.classList.add('hidden');
          admBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else {
          navUser.classList.add('hidden');
          loginBtn.classList.remove('hidden');
          regBtn.classList.remove('hidden');
          admBtn.classList.remove('hidden');
          logoutBtn.classList.add('hidden');
        }
      },

      navigate: (viewName, params = {}) => {
        router.currentRoute = viewName;
        router.updateHeader();
        const app = document.getElementById('app');

        if (viewName.startsWith('admin-dashboard') && !auth.getAdmin()) {
          toast('Access Denied', 'Please log in with admin master credentials.', 'error');
          return router.navigate('admin-auth');
        }
        if (['student-dashboard', 'subject-select', 'topic-select', 'mode-select', 'test-screen', 'result-screen', 'student-history', 'notes-view'].includes(viewName) && !auth.getStudent()) {
          toast('Authentication Required', 'Please login to access portal.', 'warning');
          return router.navigate('login');
        }

        switch (viewName) {
          case 'home':
            app.innerHTML = views.home();
            break;
          case 'register-free':
            app.innerHTML = views.registerFree();
            break;
          case 'admission':
            app.innerHTML = views.admission();
            break;
          case 'login':
            app.innerHTML = views.login();

    function handleBulkImport() {
      const raw = document.getElementById('bulkJsonInput').value.trim();
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) throw new Error('Data must be a JSON array of questions.');

        let validCount = 0;
        const questions = db.get(DB_KEYS.QUESTIONS);

        parsed.forEach(item => {
          if (item.question && item.options && item.correctAnswer && item.class) {
            questions.push({
              id: item.id || ("q_bulk_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4)),
              class: String(item.class),
              subjectId: item.subjectId || "sub_10_ps",
              topicId: item.topicId || "top_10_ps_1",
              question: item.question,
              questionOdia: item.questionOdia || "",
              options: item.options,
              correctAnswer: item.correctAnswer,
              explanation: item.explanation || "",
              marks: item.marks || 1,
              difficulty: item.difficulty || "Medium"
            });
            validCount++;
          }
        });

        db.set(DB_KEYS.QUESTIONS, questions);
        toast('Bulk Import Successful', `Imported ${validCount} questions into the bank.`, 'success');
        router.navigate('admin-dashboard', { tab: 'questions' });
      } catch (err) {
        toast('Import Error', err.message, 'error');
      }
    }

    /**
     * TEST EXECUTION ENGINE
     */
    function startTestEngine(subjectId, topicId, mode) {
      const subject = db.get(DB_KEYS.SUBJECTS).find(s => s.id === subjectId);
      const topic = db.get(DB_KEYS.TOPICS).find(t => t.id === topicId);
      let questions = db.get(DB_KEYS.QUESTIONS).filter(q => q.topicId === topicId);

      if (questions.length === 0) {
        questions = db.get(DB_KEYS.QUESTIONS);
      }

      activeExam = {
        mode,
        subject,
        topic,
        questions,
        currentIndex: 0,
        answers: {},
        practiceRevealed: {},
        timeLeft: 600,
        startTime: Date.now(),
        timerInterval: null
      };

      const navTimer = document.getElementById('navTimerBadge');
      if (mode === 'exam') {
        navTimer.classList.remove('hidden');
        startTimer();
      } else {
        navTimer.classList.add('hidden');
      }

      router.navigate('test-screen');
    }

    function startTimer() {
      clearInterval(activeExam.timerInterval);
      activeExam.timerInterval = setInterval(() => {
        activeExam.timeLeft--;
        const m = Math.floor(activeExam.timeLeft / 60);
        const s = activeExam.timeLeft % 60;
        const timeStr = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        
        const navTimerVal = document.getElementById('navTimerVal');
        if (navTimerVal) navTimerVal.innerText = timeStr;

        if (activeExam.timeLeft <= 0) {
          clearInterval(activeExam.timerInterval);
          finishTest(true);
        }
      }, 1000);
    }

    function renderQuestion() {
      const q = activeExam.questions[activeExam.currentIndex];
      const isLast = activeExam.currentIndex === activeExam.questions.length - 1;
      const isFirst = activeExam.currentIndex === 0;

      document.getElementById('testMetaMode').innerText = activeExam.mode === 'exam' ? 'Exam CBT' : 'Interactive Practice';
      document.getElementById('testMetaMode').className = `font-extrabold uppercase px-2 py-0.5 rounded text-[10px] ${activeExam.mode === 'exam' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}`;
      document.getElementById('testMetaTopic').innerText = activeExam.topic ? activeExam.topic.name : 'All Topics';
      document.getElementById('testMetaProgress').innerText = `${activeExam.currentIndex + 1} / ${activeExam.questions.length}`;

      document.getElementById('testQEn').innerText = `Q${activeExam.currentIndex + 1}. ${q.question}`;
      document.getElementById('testQOr').innerText = q.questionOdia || '';

      const container = document.getElementById('testOptionsBox');
      container.innerHTML = '';

      const userPick = activeExam.answers[q.id];

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement('button');
        let btnClasses = "w-full p-4 rounded-2xl border text-left font-medium text-xs sm:text-sm flex items-center justify-between transition transform active:scale-[0.99] ";

        if (activeExam.mode === 'exam') {
          if (userPick === key) {
            btnClasses += "border-indigo-600 bg-indigo-600 text-white font-bold shadow-md";
          } else {
            btnClasses += "border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800";
          }
        } else {
          if (activeExam.practiceRevealed[q.id]) {
            if (key === q.correctAnswer) {
              btnClasses += "border-emerald-600 bg-emerald-50 text-emerald-900 font-bold";
            } else if (userPick === key) {
              btnClasses += "border-rose-600 bg-rose-50 text-rose-900 font-bold";
            } else {
              btnClasses += "border-slate-200 bg-slate-50 opacity-60 text-slate-600";
            }
          } else {
            btnClasses += "border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800";
          }
        }

        btn.className = btnClasses;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg bg-white/40 border border-slate-300/40 flex items-center justify-center font-bold text-xs">${key}</span>
            <span>${val}</span>
          </div>
          ${activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id] && key === q.correctAnswer ? '<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>' : ''}
        `;

        btn.onclick = () => selectOption(q.id, key);
        container.appendChild(btn);
      });

      const practiceBox = document.getElementById('testPracticeBox');
      if (activeExam.mode === 'practice' && activeExam.practiceRevealed[q.id]) {
        practiceBox.classList.remove('hidden');
        practiceBox.className = userPick === q.correctAnswer ? 'p-4 rounded-2xl text-xs space-y-1.5 border border-emerald-200 bg-emerald-50' : 'p-4 rounded-2xl text-xs space-y-1.5 border border-rose-200 bg-rose-50';
        practiceBox.innerHTML = `
          <div class="flex items-center gap-1.5 font-bold ${userPick === q.correctAnswer ? 'text-emerald-800' : 'text-rose-800'}">
            <i class="fa-solid ${userPick === q.correctAnswer ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
            <span>${userPick === q.correctAnswer ? 'Correct Answer!' : 'Incorrect Answer'}</span>
          </div>
          <p class="text-slate-700 text-[11px] leading-relaxed"><strong>Explanation:</strong> ${q.explanation || 'Direct curriculum factual answer.'}</p>
        `;
      } else {
        practiceBox.classList.add('hidden');
      }

      document.getElementById('testPrevBtn').disabled = isFirst;
      if (isLast) {
        document.getElementById('testNextBtn').classList.add('hidden');
        document.getElementById('testSubmitBtn').classList.remove('hidden');
      } else {
        document.getElementById('testNextBtn').classList.remove('hidden');
        document.getElementById('testSubmitBtn').classList.add('hidden');
      }
    }

    function selectOption(qId, key) {
      activeExam.answers[qId] = key;
      if (activeExam.mode === 'practice') {
        activeExam.practiceRevealed[qId] = true;
      }
      renderQuestion();
    }

    function navigateQuestion(offset) {
      activeExam.currentIndex += offset;
      renderQuestion();
    }

    function confirmSubmitTest() {
      confirmDialog('Submit Assessment', 'Are you sure you want to finish and submit your mock test?', () => {
        finishTest(false);
      });
    }

    function finishTest(isAutoTimeout = false) {
      clearInterval(activeExam.timerInterval);
      document.getElementById('navTimerBadge').classList.add('hidden');

      let correctCount = 0;
      let wrongCount = 0;
      let obtainedMarks = 0;
      let totalMarks = activeExam.questions.length;

      const breakdown = activeExam.questions.map(q => {
        const userAns = activeExam.answers[q.id];
        const isCorrect = userAns === q.correctAnswer;
        if (isCorrect) {
          correctCount++;
          obtainedMarks += (q.marks || 1);
        } else if (userAns) {
          wrongCount++;
        }
        return {
          question: q.question,
          questionOdia: q.questionOdia,
          userAnswer: userAns,
          correctAnswer: q.correctAnswer,
          correctOptionText: q.options[q.correctAnswer],
          isCorrect,
          explanation: q.explanation
        };
      });

      const percentage = Math.round((obtainedMarks / totalMarks) * 100) || 0;
      const student = auth.getStudent() || { name: "Guest", class: "10", studentId: "GST-DEMO" };

      const resultPayload = {
        id: "res_" + Date.now(),
        studentId: student.studentId,
        studentName: student.name,
        class: student.class,
        subjectName: activeExam.subject ? activeExam.subject.name : 'General Science',
        topicName: activeExam.topic ? activeExam.topic.name : 'Comprehensive Unit',
        mode: activeExam.mode,
        totalMarks,
        obtainedMarks,
        correctCount,
        wrongCount,
        percentage,
        date: new Date().toLocaleString(),
        breakdown
      };

      const results = db.get(DB_KEYS.RESULTS);
      results.unshift(resultPayload);
      db.set(DB_KEYS.RESULTS, results);

      if (isAutoTimeout) toast('Time Out', 'Exam submitted automatically as the timer reached 00:00.', 'warning');
      router.navigate('result-screen', { resultData: resultPayload });
    }

    window.addEventListener('DOMContentLoaded', () => {
      router.navigate('home');
    });
  </script>
</body>
</html>
